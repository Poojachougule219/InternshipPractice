<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Admin Profile</title>


<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">


<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">


<link rel="stylesheet"
th:href="@{/css/Admin/profile.css?v=20}">


</head>


<body>


<div class="container">


<div class="profile-card">


	<div th:if="${success}" class="alert alert-success success-message">
	    <i class="bi bi-check-circle"></i>
	    <span th:text="${success}"></span>
	</div>

    <!-- Cover -->

    <div class="cover-section"></div>




    <!-- Profile Image -->


    <div class="text-center">


        <img th:if="${admin.profilePhoto != null}"
             th:src="@{'/uploads/Profile/Admin photos/' + ${admin.profilePhoto}}"
             class="profile-image"
             alt="Admin">


        <img th:unless="${admin.profilePhoto != null}"
             th:src="@{/img/default-profile.png}"
             class="profile-image"
             alt="Admin">


    </div>






    <!-- Admin Name -->


    <div class="text-center mt-2">


        <h2 th:text="${admin.name}">
            Admin Name
        </h2>


    </div>








    <!-- Personal Information -->


    <div class="info-card">


        <h4>

            <i class="bi bi-person-circle"></i>

            Personal Information

        </h4>


        <hr>




        <div class="row">



            <div class="col-md-6">


                <div class="info-item">

                    <strong>Name</strong>

                    <span th:text="${admin.name}"></span>

                </div>



                <div class="info-item">

                    <strong>Email</strong>

                    <span th:text="${admin.email}"></span>

                </div>




                <div class="info-item">

                    <strong>Contact</strong>

                    <span th:text="${admin.contactNo}"></span>

                </div>




                <div class="info-item">

                    <strong>Department</strong>

                    <span th:text="${admin.department}"></span>

                </div>


            </div>







            <div class="col-md-6">


                <div class="info-item">

                    <strong>City</strong>

                    <span th:text="${admin.city}"></span>

                </div>




                <div class="info-item">

                    <strong>Role</strong>

                    <span th:text="${admin.role.name}"></span>

                </div>





                <div class="info-item">

                    <strong>Status</strong>

                    <span class="badge bg-success"
                          th:text="${admin.status}">
                    </span>

                </div>





                <div class="info-item">

                    <strong>Created Date</strong>

                    <span th:text="${admin.createdDate}">
                    </span>

                </div>


            </div>


        </div>


    </div>








    <!-- Address -->


    <div class="info-card">


        <h4>

            <i class="bi bi-geo-alt"></i>

            Address Information

        </h4>


        <hr>



        <div class="info-item">


            <strong>Address</strong>


            <span th:text="${admin.address}">
            </span>


        </div>


    </div>









    <!-- Buttons -->


    <div class="button-section">



        <a th:href="@{/admin/dashboard}"
           class="btn dashboard-btn">

            <i class="bi bi-speedometer2"></i>

            Dashboard

        </a>





        <a th:href="@{/admin/edit-profile}"
           class="btn btn-edit">

            <i class="bi bi-person-gear"></i>

            Update Profile

        </a>





        <a th:href="@{/admin/upload-photo}"
           class="btn btn-primary">

            <i class="bi bi-camera"></i>

            Upload Photo

        </a>





        <a th:href="@{/admin/change-password}"
           class="btn btn-warning">

            <i class="bi bi-lock"></i>

            Change Password

        </a>



    </div>



</div>


</div>


</body>

</html>
