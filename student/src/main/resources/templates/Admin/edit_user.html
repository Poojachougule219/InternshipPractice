<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit User</title>

    <link rel="stylesheet"
          th:href="@{/css/Admin/edit_user.css}">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>


<body>


<div class="content-container">


    <!-- =================================================
         HEADER
         ================================================= -->

    <div class="page-header">

        <div>

            <h1>

                <i class="fa-solid fa-user-pen"></i>

                Edit User

            </h1>

            <p>
                Update user information
            </p>

        </div>


        <div class="header-buttons">


            <a th:href="@{/admin/dashboard}"
               class="btn dashboard-btn">

                <i class="fa-solid fa-house"></i>

                Dashboard

            </a>


            <a th:href="@{/admin/users}"
               class="btn print-btn">

                <i class="fa-solid fa-arrow-left"></i>

                Back

            </a>


        </div>

    </div>



    <!-- =================================================
         EDIT FORM
         ================================================= -->

    <div class="edit-card">


        <form th:action="@{/admin/user/update}"
              th:object="${user}"
              method="post">


            <!-- =================================================
                 HIDDEN ID
                 ================================================= -->

            <input type="hidden"
                   th:field="*{id}">


            <div class="form-grid">


                <!-- =================================================
                     NAME
                     ================================================= -->

                <div class="form-group">

                    <label>
                        Name
                    </label>

                    <input type="text"
                           th:field="*{name}"
                           required>

                </div>



                <!-- =================================================
                     EMAIL
                     READ ONLY
                     ================================================= -->

                <div class="form-group">

                    <label>
                        Email
                    </label>

                    <input type="email"
                           th:field="*{email}"
                           readonly>

                </div>



                <!-- =================================================
                     AGE
                     ================================================= -->

                <div class="form-group">

                    <label>
                        Age
                    </label>

                    <input type="number"
                           th:field="*{age}"
                           required>

                </div>



                <!-- =================================================
                     DEPARTMENT
                     ================================================= -->

                <div class="form-group">

                    <label>
                        Department
                    </label>

                    <input type="text"
                           th:field="*{department}"
                           required>

                </div>



                <!-- =================================================
                     CITY
                     ================================================= -->

                <div class="form-group">

                    <label>
                        City
                    </label>

                    <input type="text"
                           th:field="*{city}"
                           required>

                </div>



                <!-- =================================================
                     CONTACT
                     ================================================= -->

                <div class="form-group">

                    <label>
                        Contact Number
                    </label>

                    <input type="text"
                           th:field="*{contactNo}"
                           required>

                </div>



                <!-- =================================================
                     ADDRESS
                     ================================================= -->

                <div class="form-group full-width">

                    <label>
                        Address
                    </label>

                    <input type="text"
                           th:field="*{address}"
                           required>

                </div>



                <!-- =================================================
                     ROLE
                     READ ONLY
                     ================================================= -->

                <div class="form-group">

                    <label>
                        Role
                    </label>

                    <input type="text"
                           th:value="${user.role != null ? user.role.name : ''}"
                           readonly>

                </div>



                <!-- =================================================
                     STATUS
                     ================================================= -->

                <div class="form-group">

                    <label>
                        Status
                    </label>

                    <select th:field="*{status}"
                            required>

                        <option value="ACTIVE">
                            ACTIVE
                        </option>

                        <option value="INACTIVE">
                            INACTIVE
                        </option>

                    </select>

                </div>


            </div>



            <!-- =================================================
                 BUTTONS
                 ================================================= -->

            <div class="form-actions">


                <button type="submit"
                        class="btn add-btn">

                    <i class="fa-solid fa-floppy-disk"></i>

                    Update User

                </button>


                <a th:href="@{/admin/users}"
                   class="btn print-btn">

                    <i class="fa-solid fa-xmark"></i>

                    Cancel

                </a>


            </div>


        </form>


    </div>


</div>


</body>

</html>
