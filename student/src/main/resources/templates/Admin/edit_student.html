<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Student</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet" th:href="@{/css/Admin/edit_student.css}">

</head>

<body>

<div class="container py-3">

    <div class="row justify-content-center">

        <div class="col-lg-9">

            <div class="card shadow border-0 rounded-4">

                <!-- Header -->
                <div class="card-header bg-dark text-white text-center py-2">

                    <h3 class="mb-0">
                        <i class="fa-solid fa-user-pen me-2"></i>
                        Edit Student
                    </h3>

                </div>

                <!-- Body -->
                <div class="card-body p-3">

                    <form th:action="@{/admin/students/update}"
                          th:object="${student}"
                          method="post">

                        <!-- Hidden Fields -->
                        <input type="hidden" th:field="*{id}">
                        <input type="hidden" th:field="*{password}">
                        <input type="hidden" th:field="*{profilePhoto}">
                        <input type="hidden" th:field="*{createdDate}">
                        <input type="hidden" th:field="*{role.id}">

                        <!-- Row 1 -->
                        <div class="row">

                            <div class="col-md-6 mb-2">

                                <label class="form-label fw-semibold">
                                    Name
                                </label>

                                <input type="text"
                                       class="form-control"
                                       th:field="*{name}"
                                       required>

                            </div>

                            <div class="col-md-6 mb-2">

                                <label class="form-label fw-semibold">
                                    Age
                                </label>

                                <input type="number"
                                       class="form-control"
                                       th:field="*{age}"
                                       required>

                            </div>

                        </div>

                        <!-- Row 2 -->
                        <div class="row">

                            <div class="col-md-6 mb-2">

                                <label class="form-label fw-semibold">
                                    Department
                                </label>

                                <input type="text"
                                       class="form-control"
                                       th:field="*{department}"
                                       required>

                            </div>

                            <div class="col-md-6 mb-2">

                                <label class="form-label fw-semibold">
                                    Email
                                </label>

                                <input type="email"
                                       class="form-control"
                                       th:field="*{email}"
                                       readonly>

                            </div>

                        </div>

                        <!-- Row 3 -->
                        <div class="row">

                            <div class="col-md-6 mb-2">

                                <label class="form-label fw-semibold">
                                    City
                                </label>

                                <input type="text"
                                       class="form-control"
                                       th:field="*{city}">

                            </div>

                            <div class="col-md-6 mb-2">

                                <label class="form-label fw-semibold">
                                    Contact No
                                </label>

                                <input type="text"
                                       class="form-control"
                                       th:field="*{contactNo}">

                            </div>

                        </div>

                        <!-- Address -->
                        <div class="mb-2">

                            <label class="form-label fw-semibold">
                                Address
                            </label>

                            <textarea class="form-control"
                                      rows="2"
                                      th:field="*{address}">
                            </textarea>

                        </div>

                        <!-- Status -->
                        <div class="row">

                            <div class="col-md-6 mb-2">

                                <label class="form-label fw-semibold">
                                    Status
                                </label>

                                <select class="form-select"
                                        th:field="*{status}">

                                    <option value="ACTIVE">ACTIVE</option>
                                    <option value="INACTIVE">INACTIVE</option>

                                </select>

                            </div>

                        </div>

                        <!-- Buttons -->
                        <div class="text-center mt-4">

                            <button type="submit"
                                    class="btn btn-success me-3">

                                <i class="fa-solid fa-floppy-disk me-1"></i>
                                Update Student

                            </button>

                            <a th:href="@{/admin/students}"
                               class="btn btn-secondary">

                                <i class="fa-solid fa-arrow-left me-1"></i>
                                Back

                            </a>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

</body>

</html>
