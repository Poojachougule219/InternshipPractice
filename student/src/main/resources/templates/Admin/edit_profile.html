<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Edit Profile</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet"
          th:href="@{/css/Admin/edit_profile.css}">

</head>

<body>

<div class="container">

    <!-- Header -->
    <div class="edit-header">

        <h2>
            <i class="bi bi-person-gear"></i>
            Edit Profile
        </h2>

        <p>
            Update your personal information
        </p>

    </div>


    <!-- Success Message -->
    <div th:if="${success}"
         class="alert alert-success alert-dismissible fade show">

        <i class="bi bi-check-circle"></i>
        <span th:text="${success}"></span>

        <button type="button"
                class="btn-close"
                data-bs-dismiss="alert">
        </button>

    </div>


    <!-- Error Message -->
    <div th:if="${error}"
         class="alert alert-danger alert-dismissible fade show">

        <i class="bi bi-exclamation-triangle"></i>
        <span th:text="${error}"></span>

        <button type="button"
                class="btn-close"
                data-bs-dismiss="alert">
        </button>

    </div>


    <!-- Form -->

    <form th:action="@{/admin/update-profile}"
          th:object="${admin}"
          method="post"
          enctype="multipart/form-data">


        <div class="form-body">

            <div class="row">


                <!-- Name -->

                <div class="col-md-6 mb-3">

                    <label for="name">
                        Name
                    </label>

                    <input type="text"
                           id="name"
                           class="form-control"
                           th:field="*{name}"
                           required>

                </div>


                <!-- Age -->

                <div class="col-md-6 mb-3">

                    <label for="age">
                        Age
                    </label>

                    <input type="number"
                           id="age"
                           class="form-control"
                           th:field="*{age}"
                           required>

                </div>


                <!-- Email -->

                <div class="col-md-6 mb-3">

                    <label for="email">
                        Email
                    </label>

                    <input type="email"
                           id="email"
                           class="form-control"
                           th:field="*{email}"
                           readonly>

                </div>


                <!-- Contact -->

                <div class="col-md-6 mb-3">

                    <label for="contactNo">
                        Contact Number
                    </label>

                    <input type="text"
                           id="contactNo"
                           class="form-control"
                           th:field="*{contactNo}"
                           required>

                </div>


                <!-- Department -->

                <div class="col-md-6 mb-3">

                    <label for="department">
                        Department
                    </label>

                    <input type="text"
                           id="department"
                           class="form-control"
                           th:field="*{department}"
                           required>

                </div>


                <!-- City -->

                <div class="col-md-6 mb-3">

                    <label for="city">
                        City
                    </label>

                    <input type="text"
                           id="city"
                           class="form-control"
                           th:field="*{city}"
                           required>

                </div>


                <!-- Address -->

                <div class="col-md-6 mb-3">

                    <label for="address">
                        Address
                    </label>

                    <textarea id="address"
                              class="form-control"
                              rows="3"
                              th:field="*{address}"
                              required></textarea>

                </div>


                <!-- Profile Photo -->

                <div class="col-md-6 mb-3">

                    <label for="profileImage">

                        <i class="bi bi-camera"></i>

                        Profile Photo

                    </label>

                    <!-- IMPORTANT:
                         name must be profileImage
                         because controller uses @RequestParam("profileImage")
                    -->

                    <input type="file"
                           id="profileImage"
                           class="form-control"
                           name="profileImage"
                           accept="image/jpeg,image/jpg,image/png">

                    <small class="text-muted">

                        JPG, JPEG or PNG only.
                        Maximum size 5 MB.

                    </small>

                    <!-- Current Photo -->

                    <div class="mt-3"
                         th:if="${admin.profilePhoto != null and !admin.profilePhoto.isEmpty()}">

                        <p class="mb-2">
                            Current Profile Photo:
                        </p>

                        <img th:src="${admin.profilePhoto}"
                             alt="Profile Photo"
                             style="width:100px;
                                    height:100px;
                                    object-fit:cover;
                                    border-radius:50%;
                                    border:2px solid #ddd;">

                    </div>

                </div>

            </div>

        </div>


        <!-- Buttons -->

        <div class="button-area">


            <!-- Dashboard -->

            <a th:href="@{/admin/dashboard}"
               class="btn dashboard-btn">

                <i class="bi bi-speedometer2"></i>

                Dashboard

            </a>


            <!-- Save -->

            <button type="submit"
                    class="btn save-btn">

                <i class="bi bi-check-circle"></i>

                Save Changes

            </button>


            <!-- Cancel -->

            <a th:href="@{/admin/profile}"
               class="btn cancel-btn">

                <i class="bi bi-x-circle"></i>

                Cancel

            </a>


        </div>


    </form>

</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>

</html>
