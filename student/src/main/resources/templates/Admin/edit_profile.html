<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Edit Profile</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet"
          th:href="@{/css/Admin/edit_profile.css}">

</head>

<body>

<div class="container">

    <!-- =====================================================
         EDIT PROFILE CARD
         ===================================================== -->
    <div class="edit-profile-card">

        <!-- =================================================
             HEADER
             ================================================= -->
        <div class="edit-header">

            <h2>
                <i class="bi bi-person-gear"></i>
                Edit Profile
            </h2>

            <p>
                Update your personal information
            </p>

        </div>


        <!-- =================================================
             SUCCESS MESSAGE
             Appears below header, not at the top of page
             ================================================= -->
        <div th:if="${success}"
             class="alert alert-success alert-dismissible fade show profile-alert"
             role="alert">

            <i class="bi bi-check-circle"></i>

            <span th:text="${success}">
                Profile updated successfully.
            </span>

            <button type="button"
                    class="btn-close"
                    data-bs-dismiss="alert"
                    aria-label="Close">
            </button>

        </div>


        <!-- =================================================
             ERROR MESSAGE
             ================================================= -->
        <div th:if="${error}"
             class="alert alert-danger alert-dismissible fade show profile-alert"
             role="alert">

            <i class="bi bi-exclamation-triangle"></i>

            <span th:text="${error}">
                Something went wrong.
            </span>

            <button type="button"
                    class="btn-close"
                    data-bs-dismiss="alert"
                    aria-label="Close">
            </button>

        </div>


        <!-- =================================================
             FORM
             ================================================= -->
        <form th:action="@{/admin/update-profile}"
              th:object="${admin}"
              method="post"
              enctype="multipart/form-data">


            <!-- =================================================
                 FORM BODY
                 ================================================= -->
            <div class="form-body">

                <div class="row">


                    <!-- ==============================
                         NAME
                         ============================== -->
                    <div class="col-md-6 mb-3">

                        <label for="name">
                            Name
                        </label>

                        <input type="text"
                               id="name"
                               class="form-control"
                               th:field="*{name}"
                               required>

                    </div>


                    <!-- ==============================
                         AGE
                         ============================== -->
                    <div class="col-md-6 mb-3">

                        <label for="age">
                            Age
                        </label>

                        <input type="number"
                               id="age"
                               class="form-control"
                               th:field="*{age}"
                               required>

                    </div>


                    <!-- ==============================
                         EMAIL
                         ============================== -->
                    <div class="col-md-6 mb-3">

                        <label for="email">
                            Email
                        </label>

                        <input type="email"
                               id="email"
                               class="form-control"
                               th:field="*{email}"
                               readonly>

                    </div>


                    <!-- ==============================
                         CONTACT
                         ============================== -->
                    <div class="col-md-6 mb-3">

                        <label for="contactNo">
                            Contact Number
                        </label>

                        <input type="text"
                               id="contactNo"
                               class="form-control"
                               th:field="*{contactNo}"
                               required>

                    </div>


                    <!-- ==============================
                         DEPARTMENT
                         ============================== -->
                    <div class="col-md-6 mb-3">

                        <label for="department">
                            Department
                        </label>

                        <input type="text"
                               id="department"
                               class="form-control"
                               th:field="*{department}"
                               required>

                    </div>


                    <!-- ==============================
                         CITY
                         ============================== -->
                    <div class="col-md-6 mb-3">

                        <label for="city">
                            City
                        </label>

                        <input type="text"
                               id="city"
                               class="form-control"
                               th:field="*{city}"
                               required>

                    </div>


                    <!-- ==============================
                         ADDRESS
                         ============================== -->
                    <div class="col-md-6 mb-3">

                        <label for="address">
                            Address
                        </label>

                        <textarea id="address"
                                  class="form-control"
                                  rows="3"
                                  th:field="*{address}"
                                  required></textarea>

                    </div>


                    <!-- ==============================
                         PROFILE PHOTO
                         ============================== -->
                    <div class="col-md-6 mb-3">

                        <label for="profilePhoto">

                            <i class="bi bi-camera"></i>

                            Profile Photo

                        </label>


                        <!--
                            IMPORTANT:

                            AdminPageController expects:

                            @RequestParam(
                                value = "profilePhoto",
                                required = false
                            )

                            Therefore the input name must be:
                            profilePhoto
                        -->

                        <input type="file"
                               id="profilePhoto"
                               class="form-control"
                               name="profilePhoto"
                               accept="image/jpeg,image/jpg,image/png">


                        <small class="text-muted">

                            JPG, JPEG or PNG only.
                            Maximum size 5 MB.

                        </small>


                        <!-- ==============================
                             CURRENT PROFILE PHOTO
                             ============================== -->

                        <div class="current-photo"
                             th:if="${admin.profilePhoto != null and admin.profilePhoto.length > 0}">

                            <p class="current-photo-title">

                                Current Profile Photo:

                            </p>


                            <img th:src="@{/admin/profile-photo}"
                                 alt="Profile Photo"
                                 class="current-profile-image">

                        </div>

                    </div>

                </div>

            </div>


            <!-- =================================================
                 BUTTON AREA
                 ================================================= -->
            <div class="button-area">


                <!-- DASHBOARD -->

                <a th:href="@{/admin/dashboard}"
                   class="btn dashboard-btn">

                    <i class="bi bi-speedometer2"></i>

                    Dashboard

                </a>


                <!-- SAVE -->

                <button type="submit"
                        class="btn save-btn">

                    <i class="bi bi-check-circle"></i>

                    Save Changes

                </button>


                <!-- CANCEL -->

                <a th:href="@{/admin/profile}"
                   class="btn cancel-btn">

                    <i class="bi bi-x-circle"></i>

                    Cancel

                </a>

            </div>

        </form>

    </div>

</div>


<!-- =====================================================
     BOOTSTRAP JS
     ===================================================== -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


<!-- =====================================================
     AUTO HIDE SUCCESS / ERROR MESSAGE
     ===================================================== -->

<script>

    setTimeout(function () {

        const alerts =
            document.querySelectorAll('.profile-alert');

        alerts.forEach(function (alert) {

            const bsAlert =
                bootstrap.Alert.getOrCreateInstance(alert);

            bsAlert.close();

        });

    }, 4000);

</script>


</body>

</html>
