<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

	<meta charset="UTF-8">

	<title>Admin - Manage Students</title>


	<!-- Bootstrap -->
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">


	<!-- Font Awesome -->
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">


	<!-- CSS -->
	<link rel="stylesheet" th:href="@{/css/Admin/students.css}">


</head>


<body>


	<div class="main">


		<div class="container-fluid py-4">



			<!-- ================= TOP HEADER ================= -->


			<div class="d-flex justify-content-between align-items-center mb-4">


				<div>

					<h2 class="page-title">

						<i class="fa-solid fa-users"></i>

						Manage Students

					</h2>


					<p class="text-muted mb-0">

						View and manage only student records.

					</p>


				</div>




				<!-- BUTTONS -->


				<div class="d-flex gap-3">


					<!-- Add Student First -->

					<a th:href="@{/register}" class="add-student">

						<i class="fa-solid fa-user-plus"></i>

						Add Student

					</a>




					<!-- Dashboard Second -->

					<a th:href="@{/admin/dashboard}" class="dashboard-btn">

						<i class="fa-solid fa-chart-line"></i>

						Dashboard

					</a>


				</div>



			</div>





			<!-- ================= SEARCH ================= -->


			<div class="card student-card shadow-lg border-0 rounded-4 mb-4">


				<div class="card-body">


					<form th:action="@{/admin/students}" method="get">


						<div class="row g-3">



							<div class="col-lg-3">


								<div class="input-group">


									<span class="input-group-text">

										<i class="fa-solid fa-search"></i>

									</span>


									<input type="text" class="form-control" name="keyword"
										placeholder="Search Student..." th:value="${keyword}">


								</div>


							</div>





							<div class="col-lg-2">

								<input type="text" class="form-control" name="department" placeholder="Department"
									th:value="${department}">

							</div>





							<div class="col-lg-2">


								<select class="form-select" name="sortField">


									<option value="id" th:selected="${sortField=='id'}">
										ID
									</option>


									<option value="name" th:selected="${sortField=='name'}">
										Name
									</option>


									<option value="createdDate" th:selected="${sortField=='createdDate'}">
										Created Date
									</option>


								</select>


							</div>






							<div class="col-lg-2">


								<select class="form-select" name="sortDir">


									<option value="asc" th:selected="${sortDir=='asc'}">
										Ascending
									</option>


									<option value="desc" th:selected="${sortDir=='desc'}">
										Descending
									</option>


								</select>


							</div>






							<div class="col-lg-3 d-grid">


								<button class="search-btn" type="submit">


									<i class="fa-solid fa-filter"></i>

									Search


								</button>


							</div>



						</div>


					</form>


				</div>


			</div>






			<!-- ================= TABLE ================= -->


			<div class="card student-card shadow-lg border-0 rounded-4">


				<div class="card-body p-0">


					<div class="table-responsive">


						<table class="table table-hover align-middle mb-0">


							<thead>


								<tr>

									<th>ID</th>

									<th>Name</th>

									<th>Department</th>

									<th>Email</th>

									<th>City</th>

									<th>Status</th>

									<th>Created Date</th>

									<th class="text-center">
										Actions
									</th>


								</tr>


							</thead>





							<tbody>



								<tr th:each="student : ${students.content}">


									<td th:text="${student.id}"></td>


									<td th:text="${student.name}"></td>


									<td th:text="${student.department}"></td>


									<td th:text="${student.email}"></td>


									<td th:text="${student.city}"></td>





									<td>


										<span class="status active" th:if="${student.status=='ACTIVE'}">

											ACTIVE

										</span>


										<span class="status inactive" th:if="${student.status=='INACTIVE'}">

											INACTIVE

										</span>


									</td>





									<td th:text="${#temporals.format(student.createdDate,'dd-MM-yyyy')}"></td>






									<td class="text-center">


										<a th:href="@{/admin/students/edit/{id}(id=${student.id})}" class="edit-btn me-2">
										    <i class="fa-solid fa-pen"></i>
										</a>

										
										<a th:href="@{/admin/students/delete/{id}(id=${student.id})}"
										   class="delete-btn"
										   onclick="return confirm('Delete this student?');"
										   title="Delete">

										    <i class="fa-solid fa-trash"></i>

										</a>


									</td>


								</tr>







								<tr th:if="${students.isEmpty()}">


									<td colspan="8" class="text-center py-5">


										<i class="fa-solid fa-circle-info fa-2x text-secondary"></i>


										<h5 class="text-secondary mt-3">

											No Students Found

										</h5>


									</td>


								</tr>



							</tbody>


						</table>


					</div>


				</div>


			</div>







			<!-- ================= PAGINATION ================= -->


			<div class="pagination-footer mt-4">


				<div class="pagination-content">


					<div class="text-muted fw-semibold">


						Showing Page

						<span th:text="${currentPage+1}"></span>

						of

						<span th:text="${totalPages}"></span>


					</div>





					<nav th:if="${totalPages > 1}">


						<ul class="pagination mb-0">



							<li class="page-item" th:classappend="${currentPage==0}?'disabled'">


								<a class="page-link" th:href="@{/admin/students(
																page=${currentPage-1},
																keyword=${keyword},
																department=${department},
																sortField=${sortField},
																sortDir=${sortDir}
																)}">


									<i class="fa-solid fa-angle-left"></i>


								</a>


							</li>





							<li class="page-item" th:each="i:${#numbers.sequence(0,totalPages-1)}"
								th:classappend="${i==currentPage}?'active'">


								<a class="page-link" th:text="${i+1}" th:href="@{/admin/students(
																	page=${i},
																	keyword=${keyword},
																	department=${department},
																	sortField=${sortField},
																	sortDir=${sortDir}
																	)}">

								</a>


							</li>





							<li class="page-item" th:classappend="${currentPage==totalPages-1}?'disabled'">


								<a class="page-link" th:href="@{/admin/students(
																	page=${currentPage+1},
																	keyword=${keyword},
																	department=${department},
																	sortField=${sortField},
																	sortDir=${sortDir}
																	)}">


									<i class="fa-solid fa-angle-right"></i>


								</a>


							</li>



						</ul>


					</nav>


				</div>


			</div>



		</div>


	</div>



</body>


</html>
