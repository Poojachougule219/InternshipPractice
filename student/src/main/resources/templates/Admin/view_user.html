<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>View User</title>

	<link rel="stylesheet" th:href="@{/css/Admin/view_user.css}">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    
</head>

<body>

<div class="content-container">

    <!-- Header -->

    <div class="page-header">

        <div>

            <h1>

                <i class="fa-solid fa-eye"></i>

                View User

            </h1>

            <p>View complete user information</p>

        </div>

        <div class="header-buttons">

            <a th:href="@{/admin/dashboard}" class="btn dashboard-btn">

                <i class="fa-solid fa-house"></i>

                Dashboard

            </a>

            <a th:href="@{/admin/users}" class="btn add-btn">

                <i class="fa-solid fa-arrow-left"></i>

                Back to Users

            </a>

        </div>

    </div>

    <!-- User Details -->

    <div class="view-card">

        <div class="form-grid">

            <div class="form-group">

                <label>ID</label>

                <input type="text" th:value="${user.id}" readonly>

            </div>

            <div class="form-group">

                <label>Name</label>

                <input type="text" th:value="${user.name}" readonly>

            </div>

            <div class="form-group">

                <label>Email</label>

                <input type="email" th:value="${user.email}" readonly>

            </div>

            <div class="form-group">

                <label>Role</label>

                <input type="text" th:value="${user.role.name}" readonly>

            </div>

            <div class="form-group">

                <label>Age</label>

                <input type="text" th:value="${user.age}" readonly>

            </div>

            <div class="form-group">

                <label>Department</label>

                <input type="text" th:value="${user.department}" readonly>

            </div>

            <div class="form-group">

                <label>City</label>

                <input type="text" th:value="${user.city}" readonly>

            </div>

            <div class="form-group">

                <label>Contact Number</label>

                <input type="text" th:value="${user.contactNo}" readonly>

            </div>

            <div class="form-group full-width">

                <label>Address</label>

                <input type="text" th:value="${user.address}" readonly>

            </div>

            <div class="form-group">

                <label>Status</label>

                <input type="text" th:value="${user.status}" readonly>

            </div>

            <div class="form-group">

                <label>Registered On</label>

                <input type="text" th:value="${user.createdDate}" readonly>

            </div>

        </div>

    </div>

</div>

</body>

</html>
