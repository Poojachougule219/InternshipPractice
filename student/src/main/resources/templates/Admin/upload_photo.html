<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Upload Profile Photo</title>

    <link rel="stylesheet"
          th:href="@{/css/Admin/upload_photo.css}">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          rel="stylesheet">

</head>

<body>

<div class="upload-container">

    <div class="upload-card">

        <h2>
            <i class="bi bi-camera"></i>
            Upload Profile Photo
        </h2>


        <!-- CURRENT PROFILE PHOTO -->

        <div class="preview">

            <img th:if="${admin.profilePhoto != null and !admin.profilePhoto.isEmpty()}"
                 th:src="@{${admin.profilePhoto}}"
                 alt="Profile Photo">

            <img th:unless="${admin.profilePhoto != null and !admin.profilePhoto.isEmpty()}"
                 th:src="@{/img/default-profile.png}"
                 alt="Default Profile">

        </div>


        <!-- UPLOAD FORM -->

        <form th:action="@{/admin/upload-photo}"
              method="post"
              enctype="multipart/form-data">

            <label>Select Photo</label>

            <input type="file"
                   name="image"
                   accept="image/jpeg,image/jpg,image/png"
                   required>

            <small>
                JPG, JPEG or PNG only. Maximum size 5 MB.
            </small>


            <button type="submit">

                <i class="bi bi-upload"></i>

                Upload Photo

            </button>

        </form>


        <!-- BACK -->

        <a th:href="@{/admin/profile}"
           class="back-btn">

            Back to Profile

        </a>

    </div>

</div>

</body>

</html>
