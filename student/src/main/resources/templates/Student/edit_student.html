<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<title>Edit Student</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">

            <h3>Edit Student</h3>

        </div>

        <div class="card-body">

            <form th:action="@{'/students/update/' + ${student.id}}"
                  method="post">

                <div class="mb-3">

                    <label>Name</label>

                    <input
                            type="text"
                            class="form-control"
                            name="name"
                            th:value="${student.name}"
                            required>

                </div>

                <div class="mb-3">

                    <label>Age</label>

                    <input
                            type="number"
                            class="form-control"
                            name="age"
                            th:value="${student.age}"
                            required>

                </div>

                <div class="mb-3">

                    <label>Department</label>

                    <input
                            type="text"
                            class="form-control"
                            name="department"
                            th:value="${student.department}"
                            required>

                </div>

                <div class="mb-3">

                    <label>Email</label>

                    <input
                            type="email"
                            class="form-control"
                            name="email"
                            th:value="${student.email}"
                            required>

                </div>

                <div class="mb-3">

                    <label>City</label>

                    <input
                            type="text"
                            class="form-control"
                            name="city"
                            th:value="${student.city}"
                            required>

                </div>

                <div class="mb-3">

                    <label>Password</label>

                    <input
                            type="text"
                            class="form-control"
                            name="password"
                            th:value="${student.password}"
                            required>

                </div>

                <div class="mb-3">

                    <label>Status</label>

                    <select
                            class="form-select"
                            name="status">

                        <option value="ACTIVE"
                                th:selected="${student.status=='ACTIVE'}">

                            ACTIVE

                        </option>

                        <option value="INACTIVE"
                                th:selected="${student.status=='INACTIVE'}">

                            INACTIVE

                        </option>

                    </select>

                </div>

                <button class="btn btn-success">

                    Update Student

                </button>

                <a href="/students"
                   class="btn btn-secondary">

                    Cancel

                </a>

            </form>

        </div>

    </div>

</div>

</body>

</html>
