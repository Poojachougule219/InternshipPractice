<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Edit Profile</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet"
          th:href="@{/css/Student/edit_profile.css}">

</head>


<body>

<div class="edit-profile-container">

    <div class="edit-profile-card">


        <!-- =========================================
             HEADER
        ========================================== -->

        <div class="edit-profile-header">

            <!-- PROFILE IMAGE -->

            <div class="profile-image-container">

                <img th:if="${student.profilePhoto != null and student.profilePhoto.length > 0}"
                     th:src="@{/student/profile-photo}"
                     class="edit-profile-image"
                     alt="Profile">

                <img th:unless="${student.profilePhoto != null and student.profilePhoto.length > 0}"
                     th:src="@{/images/default-profile.png}"
                     class="edit-profile-image"
                     alt="Profile">

            </div>


            <h2>Edit Profile</h2>

        </div>



        <!-- =========================================
             BODY
        ========================================== -->

        <div class="edit-profile-body">


            <!-- SUCCESS MESSAGE -->

            <div th:if="${success}"
                 class="alert alert-success message">

                <span th:text="${success}">
                    Profile updated successfully
                </span>

            </div>


            <!-- ERROR MESSAGE -->

            <div th:if="${error}"
                 class="alert alert-danger message">

                <span th:text="${error}">
                    Error
                </span>

            </div>



            <!-- =====================================
                 FORM
            ====================================== -->

            <form th:action="@{/student/update-profile}"
                  th:object="${student}"
                  method="post"
                  enctype="multipart/form-data"
                  class="edit-profile-form">


                <!-- =================================
                     ROW 1
                ================================== -->

                <div class="form-row">

                    <!-- NAME -->

                    <div class="form-group">

                        <label for="name">
                            Full Name
                        </label>

                        <input type="text"
                               id="name"
                               th:field="*{name}"
                               maxlength="100"
                               required>

                    </div>


                    <!-- EMAIL -->

                    <div class="form-group">

                        <label for="email">
                            Email
                        </label>

                        <input type="email"
                               id="email"
                               th:field="*{email}"
                               readonly>

                    </div>

                </div>



                <!-- =================================
                     ROW 2
                ================================== -->

                <div class="form-row">

                    <!-- AGE -->

                    <div class="form-group">

                        <label for="age">
                            Age
                        </label>

                        <input type="number"
                               id="age"
                               th:field="*{age}"
                               min="18"
                               max="60"
                               required>

                    </div>


                    <!-- DEPARTMENT -->

                    <div class="form-group">

                        <label for="department">
                            Department
                        </label>

                        <input type="text"
                               id="department"
                               th:field="*{department}"
                               maxlength="100"
                               required>

                    </div>

                </div>



                <!-- =================================
                     ROW 3
                ================================== -->

                <div class="form-row">

                    <!-- CONTACT -->

                    <div class="form-group">

                        <label for="contactNo">
                            Contact Number
                        </label>

                        <input type="text"
                               id="contactNo"
                               th:field="*{contactNo}"
                               maxlength="10"
                               pattern="[0-9]{10}"
                               inputmode="numeric"
                               required>

                    </div>


                    <!-- CITY -->

                    <div class="form-group">

                        <label for="city">
                            City
                        </label>

                        <input type="text"
                               id="city"
                               th:field="*{city}"
                               maxlength="100"
                               required>

                    </div>

                </div>



                <!-- =================================
                     ADDRESS
                ================================== -->

                <div class="form-group full-width">

                    <label for="address">
                        Address
                    </label>

                    <textarea id="address"
                              th:field="*{address}"
                              maxlength="255"
                              required></textarea>

                </div>



                <!-- =================================
                     PROFILE PHOTO
                ================================== -->

                <div class="form-group full-width">

                    <label for="profilePhotoFile">
                        Profile Photo
                    </label>

                    <input type="file"
                           id="profilePhotoFile"
                           name="profilePhotoFile"
                           accept=".jpg,.jpeg,.png,image/jpeg,image/png">

                    <small class="photo-help">
                        JPG, JPEG or PNG only. Maximum size: 5 MB.
                    </small>

                </div>



                <!-- =================================
                     BUTTONS
                ================================== -->

                <div class="button-area">

                    <button type="submit"
                            class="update-btn">

                        Update Profile

                    </button>


                    <a th:href="@{/student/profile}"
                       class="cancel-btn">

                        Cancel

                    </a>


                    <a th:href="@{/student/dashboard}"
                       class="dashboard-btn">

                        Dashboard

                    </a>

                </div>


            </form>

        </div>

    </div>

</div>


</body>

</html>
