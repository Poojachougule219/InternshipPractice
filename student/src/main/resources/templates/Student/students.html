<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

	<meta charset="UTF-8">

	<title>Student Management System</title>

	<!-- Bootstrap -->
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

	<!-- Font Awesome -->
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

	<!--CSS Link-->
	<link rel="stylesheet" th:href="@{/css/dashboard.css?v=60}">

	<link rel="stylesheet" th:href="@{/css/students.css?v=101}">

</head>

<body>

	<!-- =========================
        Sidebar
========================= -->

	<div class="sidebar">

		<h3>
			<i class="fa-solid fa-user-graduate"></i>
			Student Management System
		</h3>

		<a th:href="@{/dashboard}">
			<i class="fa-solid fa-chart-line"></i>
			Dashboard
		</a>

		<a th:href="@{/students}">
			<i class="fa-solid fa-users"></i>
			Student Records
		</a>



		<a href="#">
			<i class="fa-solid fa-magnifying-glass"></i>
			Search Students
		</a>

		<a href="#">
			<i class="fa-solid fa-file-lines"></i>
			Reports
		</a>

		<a href="#">
			<i class="fa-solid fa-gear"></i>
			Settings
		</a>

		<a th:href="@{/logout}">
			<i class="fa-solid fa-right-from-bracket"></i>
			Logout
		</a>

	</div>

	<!-- =========================
        Main Content
========================= -->

	<div class="main">

		<div class="container-fluid py-4">

			<!-- Page Header -->

			<div class="d-flex justify-content-between align-items-center mb-4">

				<div>

					<h2 class="page-title">
						<i class="fa-solid fa-users"></i>
						Student Portal
					</h2>

					<p class="text-muted mb-0">
						Manage all student records with search, filter and pagination.
					</p>

				</div>


				<a th:href="@{/register}" class="add-student">

					<i class="fa-solid fa-user-plus"></i>
					Add Student

				</a>


			</div>

			<!-- Search Card -->

			<div class="card student-card shadow-lg border-0 rounded-4 mb-4">

				<div class="card-body">

					<form th:action="@{/students}" method="get">

						<div class="row g-3 align-items-center">

							<!-- Search -->

							<div class="col-lg-3">

								<div class="input-group">

									<span class="input-group-text">
										<i class="fa-solid fa-magnifying-glass"></i>
									</span>

									<input type="text" class="form-control" name="name" placeholder="Search Student..."
										th:value="${param.name}">

								</div>

							</div>

							<!-- Status -->

							<div class="col-lg-2">

								<select class="form-select" name="status">

									<option value="" disabled hidden th:selected="${param.status==null}">
										Filter by Status
									</option>

									<option value="ACTIVE" th:selected="${param.status=='ACTIVE'}">
										Active
									</option>

									<option value="INACTIVE" th:selected="${param.status=='INACTIVE'}">
										Inactive
									</option>

								</select>

							</div>

							<!-- Sort -->

							<div class="col-lg-2">

								<select class="form-select" name="sortBy">

									<option value="" disabled hidden th:selected="${param.sortBy==null}">
										Sort By
									</option>

									<option value="name" th:selected="${param.sortBy=='name'}">
										Name
									</option>

									<option value="createdDate" th:selected="${param.sortBy=='createdDate'}">
										Created Date
									</option>

								</select>

							</div>

							<!-- Direction -->

							<div class="col-lg-2">

								<select class="form-select" name="direction">

									<option value="asc" th:selected="${param.direction=='asc'}">
										Ascending
									</option>

									<option value="desc" th:selected="${param.direction=='desc'}">
										Descending
									</option>

								</select>

							</div>

							<!-- Search Button -->

							<div class="col-lg-3 d-grid">

								<button type="submit" class="search-btn">

									<i class="fa-solid fa-magnifying-glass"></i>
									Search

								</button>

							</div>

						</div>

					</form>

				</div>

			</div>

			<!-- Student Table -->

			<div class="card student-card shadow-lg border-0 rounded-4">

				<div class="card-body p-0">

					<div class="table-responsive">

						<table class="table table-hover align-middle mb-0">

							<thead>

								<tr>

									<th>ID</th>
									<th>Name</th>
									<th>Department</th>
									<th>Email</th>
									<th>City</th>
									<th>Status</th>
									<th>Created Date</th>
									<th class="text-center">Actions</th>

								</tr>

							</thead>

							<tbody>

								<tr th:each="student : ${students}">
									<td th:text="${student.id}"></td>

									<td th:text="${student.name}"></td>

									<td th:text="${student.department}"></td>

									<td th:text="${student.email}"></td>

									<td th:text="${student.city}"></td>

									<td>

										<span class="status active" th:if="${student.status=='ACTIVE'}">
											ACTIVE
										</span>

										<span class="status inactive" th:if="${student.status=='INACTIVE'}">
											INACTIVE
										</span>

									</td>

									<td th:text="${#temporals.format(student.createdDate,'dd-MM-yyyy')}"></td>

									<td class="text-center">

										<!-- Edit -->

										<a th:href="@{'/students/edit/' + ${student.id}}" class="edit-btn me-2"
											title="Edit">

											<i class="fa-solid fa-pen-to-square"></i>

										</a>

										<!-- Delete -->

										<a th:href="@{'/students/delete/' + ${student.id}}" class="delete-btn"
											title="Delete"
											onclick="return confirm('Are you sure you want to delete this student?');">

											<i class="fa-solid fa-trash"></i>

										</a>

									</td>

								</tr>

								<!-- No Data -->

								<tr th:if="${#lists.isEmpty(students)}">

									<td colspan="8" class="text-center py-5">

										<i class="fa-solid fa-circle-info fa-2x text-secondary mb-3"></i>

										<h5 class="text-secondary">

											No Students Found

										</h5>

									</td>

								</tr>

							</tbody>

						</table>

					</div>

				</div>

			</div>


			<!-- Pagination -->

			<div class="pagination-footer">

				<div class="pagination-content">

					<div class="text-muted fw-semibold">

						Showing Page
						<span th:text="${currentPage + 1}"></span>
						of
						<span th:text="${totalPages}"></span>

					</div>

					<nav th:if="${totalPages > 1}">

						<ul class="pagination shadow-sm mb-0">

							<!-- Previous -->

							<li class="page-item" th:classappend="${currentPage==0} ? 'disabled'">

								<a class="page-link" th:href="@{/students(page=${currentPage-1},
										                                            name=${param.name},
										                                            status=${param.status},
										                                            sortBy=${param.sortBy},
										                                            direction=${param.direction})}">

									<i class="fa-solid fa-angle-left"></i>

								</a>

							</li>

							<!-- Page Numbers -->

							<li class="page-item" th:each="i : ${#numbers.sequence(0,totalPages-1)}"
								th:classappend="${i==currentPage} ? 'active'">

								<a class="page-link" th:text="${i+1}" th:href="@{/students(page=${i},
										                                            name=${param.name},
										                                            status=${param.status},
										                                            sortBy=${param.sortBy},
										                                            direction=${param.direction})}">
								</a>

							</li>

							<!-- Next -->

							<li class="page-item" th:classappend="${currentPage==totalPages-1} ? 'disabled'">

								<a class="page-link" th:href="@{/students(page=${currentPage+1},
										                                            name=${param.name},
										                                            status=${param.status},
										                                            sortBy=${param.sortBy},
										                                            direction=${param.direction})}">

									<i class="fa-solid fa-angle-right"></i>

								</a>

							</li>

						</ul>

					</nav>

				</div>

			</div>




		</div>

</body>

</html>
