<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Upload Profile Photo</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet"
          th:href="@{/css/Student/upload_photo.css}">

</head>

<body>

<div class="upload-container">

    <div class="upload-card">

        <!-- =========================================
             HEADER
        ========================================== -->

        <div class="upload-header">

            <h2>
                <i class="bi bi-camera-fill"></i>
                Upload Profile Photo
            </h2>

            <p>
                Update your profile picture
            </p>

        </div>


        <!-- =========================================
             CURRENT PROFILE PHOTO
        ========================================== -->

        <div class="photo-preview">

            <img th:if="${student.profilePhoto != null
                         and student.profilePhoto.length > 0}"
                 th:src="@{/student/profile-photo}"
                 class="profile-image"
                 alt="Profile Photo">

            <img th:unless="${student.profilePhoto != null
                              and student.profilePhoto.length > 0}"
                 th:src="@{/img/default-profile.png}"
                 class="profile-image"
                 alt="Default Profile Photo">

        </div>


        <!-- =========================================
             STUDENT NAME
        ========================================== -->

        <div class="student-name">

            <h4 th:text="${student.name}">
                Student
            </h4>

            <p th:text="${student.email}">
                student@email.com
            </p>

        </div>


        <!-- =========================================
             SUCCESS MESSAGE
        ========================================== -->

        <div th:if="${success}"
             class="alert alert-success message">

            <i class="bi bi-check-circle-fill"></i>

            <span th:text="${success}">
                Profile photo uploaded successfully
            </span>

        </div>


        <!-- =========================================
             ERROR MESSAGE
        ========================================== -->

        <div th:if="${error}"
             class="alert alert-danger message">

            <i class="bi bi-exclamation-circle-fill"></i>

            <span th:text="${error}">
                Failed to upload profile photo
            </span>

        </div>


        <!-- =========================================
             UPLOAD FORM
        ========================================== -->

        <form th:action="@{/student/upload-photo}"
              method="post"
              enctype="multipart/form-data">

            <div class="upload-section">

                <label for="profilePhotoFile"
                       class="form-label">

                    Select Profile Photo

                </label>

                <input type="file"
                       id="profilePhotoFile"
                       name="profilePhotoFile"
                       class="form-control"
                       accept=".jpg,.jpeg,.png,image/jpeg,image/png"
                       required>

                <small class="form-text">
                    JPG, JPEG or PNG only. Maximum size: 5 MB.
                </small>

            </div>


            <!-- =========================================
                 BUTTONS
            ========================================== -->

            <div class="button-area">

                <button type="submit"
                        class="upload-btn">

                    <i class="bi bi-cloud-arrow-up-fill"></i>
                    Upload Photo

                </button>

                <a th:href="@{/student/profile}"
                   class="back-btn">

                    <i class="bi bi-arrow-left"></i>
                    Back to Profile

                </a>

                <a th:href="@{/student/dashboard}"
                   class="dashboard-btn">

                    <i class="bi bi-house-fill"></i>
                    Dashboard

                </a>

            </div>

        </form>

    </div>

</div>

</body>

</html>
