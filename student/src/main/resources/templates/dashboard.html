<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<title>Dashboard</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">

<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<link rel="stylesheet" th:href="@{/css/dashboard.css}">

</head>

<body>

<!-- Sidebar -->
<div class="sidebar">

    <h3>
        <i class="fa-solid fa-user-graduate"></i>
        Student Management System
    </h3>

    <a href="/student/page">
        <i class="fa-solid fa-chart-line"></i>
        Dashboard
    </a>

    <a href="/students">
        <i class="fa-solid fa-users"></i>
        Student Records
    </a>

    <a href="/register">
        <i class="fa-solid fa-user-plus"></i>
        Add Student
    </a>

    <a href="#">
        <i class="fa-solid fa-magnifying-glass"></i>
        Search Students
    </a>

    <a href="#">
        <i class="fa-solid fa-file-lines"></i>
        Reports
    </a>

    <a href="#">
        <i class="fa-solid fa-gear"></i>
        Settings
    </a>

    <a href="/logout">
        <i class="fa-solid fa-right-from-bracket"></i>
        Logout
    </a>

</div>

<!-- Main Content -->
<div class="main">

    <!-- Header -->
    <div class="header d-flex justify-content-between align-items-center">

        <div>

            <h2>Dashboard</h2>

            <p>
                Welcome,
                <b th:text="${student.name}"></b>
            </p>

        </div>

        <a href="/logout" class="logout-btn">
            Logout
        </a>

    </div>

    <!-- Statistics Cards -->
    <div class="row mt-4">

        <div class="col-md-4">

            <div class="stat-card total-card">

                <div class="card-icon">
                    <i class="fa-solid fa-user-graduate"></i>
                </div>

                <div>
                    <h5>Total Students</h5>
                    <h2 th:text="${totalStudents}"></h2>
                </div>

            </div>

        </div>

        <div class="col-md-4">

            <div class="stat-card active-card">

                <div class="card-icon">
                    <i class="fa-solid fa-user-check"></i>
                </div>

                <div>
                    <h5>Active Records</h5>
                    <h2 th:text="${activeRecords}"></h2>
                </div>

            </div>

        </div>

        <div class="col-md-4">

            <div class="stat-card recent-card">

                <div class="card-icon">
                    <i class="fa-solid fa-clock"></i>
                </div>

                <div>
                    <h5>Recently Added</h5>
                    <h2 th:text="${recentRecords}"></h2>
                </div>

            </div>

        </div>

    </div>
	
	

	<!-- ==========================
	     STUDENTS BY CITY CHART
	========================== -->

	<div class="row mt-4 justify-content-center">

		<div class="col-lg-6 col-md-8">

	        <div class="card chart-card shadow-sm">

	            <div class="card-header bg-white border-0">

	                <h5 class="mb-0">
	                    <i class="fa-solid fa-chart-pie text-primary"></i>
	                    Students by City
	                </h5>

	            </div>

	            <div class="card-body">

	                <div class="chart-container">

	                    <canvas id="cityChart"></canvas>

	                </div>

	            </div>

	        </div>

	    </div>

	</div>
	

    <!-- Footer -->
    <footer class="footer">

        <div class="footer-content">

            <div class="footer-left">
                <i class="fa-solid fa-user-graduate"></i>
                <span>Student Management System</span>
            </div>

            <div class="footer-center">
                © 2026 All Rights Reserved
            </div>

            <div class="footer-right">
                Developed by <strong>Pooja Chougule</strong>
            </div>

        </div>

    </footer>

</div>


<!-- Pass Java data to JavaScript -->
<script th:inline="javascript">
    const cityData = /*[[${cityData}]]*/ [];
    console.log("City Data:", cityData);
</script>

<!-- Chart.js Library -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<!-- Your JavaScript -->
<script th:src="@{/js/dashboard.js}"></script>

</body>
</html>
