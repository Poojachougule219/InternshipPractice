<!DOCTYPE html>

<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>


<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Edit Approval</title>

<link rel="stylesheet" th:href="@{/css/Approval/approval-edit.css}">

<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">


</head>

<body>

<div class="page-container">


<div class="page-header">

    <div class="header-left">

        <a th:href="@{/approval/view/{id}(id=${approval.id})}"
           class="back-link">

            <i class="fa-solid fa-arrow-left"></i>

            Back to Approval

        </a>

        <h1>

            <i class="fa-solid fa-pen-to-square"></i>

            Edit Approval

        </h1>

        <p>Update the approval request details below.</p>

    </div>

</div>


<div class="form-card">

    <form th:action="@{/approval/update/{id}(id=${approval.id})}"
          th:object="${approval}"
          method="post">

        <input type="hidden" th:field="*{id}">


        <div class="form-section">

            <h2>

                <i class="fa-solid fa-file-contract"></i>

                Approval Details

            </h2>


            <div class="form-group">

                <label for="contract">

                    <i class="fa-solid fa-file-signature"></i>

                    Contract

                </label>

                <input type="text"
                       id="contract"
                       th:value="${approval.contract != null ? approval.contract.contractNumber + ' - ' + approval.contract.title : 'Not Available'}"
                       readonly>

            </div>


            <div class="form-group">

                <label for="modification">

                    <i class="fa-solid fa-file-pen"></i>

                    Modification

                </label>

                <input type="text"
                       id="modification"
                       th:value="${approval.modification != null ? 'Modification #' + approval.modification.id : 'Not Available'}"
                       readonly>

            </div>


            <div class="form-group">

                <label for="approver">

                    <i class="fa-solid fa-user-check"></i>

                    Approver

                </label>

                <input type="text"
                       id="approver"
                       th:value="${approval.approver != null ? approval.approver.username : 'Not Available'}"
                       readonly>

            </div>

        </div>


        <div class="form-section">

            <h2>

                <i class="fa-solid fa-comment-dots"></i>

                Approval Review

            </h2>


            <div class="form-group">

                <label for="comments">

                    <i class="fa-solid fa-comments"></i>

                    Comments

                </label>

                <textarea id="comments"
                          th:field="*{comments}"
                          rows="5"
                          placeholder="Enter approval comments..."></textarea>

            </div>

        </div>


        <div class="form-section">

            <h2>

                <i class="fa-solid fa-circle-check"></i>

                Approval Status

            </h2>


            <div class="form-group">

                <label for="status">

                    <i class="fa-solid fa-flag"></i>

                    Status

                </label>

                <select id="status"
                        th:field="*{status}"
                        required>

                    <option value="PENDING">Pending</option>

                    <option value="APPROVED">Approved</option>

                    <option value="REJECTED">Rejected</option>

                </select>

            </div>

        </div>


        <div class="form-actions">

            <a th:href="@{/approval/view/{id}(id=${approval.id})}"
               class="cancel-btn">

                <i class="fa-solid fa-xmark"></i>

                Cancel

            </a>

            <button type="submit"
                    class="update-btn">

                <i class="fa-solid fa-floppy-disk"></i>

                Update Approval

            </button>

        </div>

    </form>

</div>


<div class="bottom-navigation">

    <a th:href="@{/approval/approvals}">

        <i class="fa-solid fa-list"></i>

        Back to Approvals

    </a>

</div>


</div>

</body>

</html>
