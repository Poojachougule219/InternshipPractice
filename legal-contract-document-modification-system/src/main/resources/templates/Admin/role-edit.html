<!DOCTYPE html>

<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Edit Role | Legal Contract System</title>

<link rel="stylesheet" th:href="@{/css/Admin/role-edit.css}">
<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">


</head>

<body>

<div class="content-container">


<div class="page-header">

    <div class="header-buttons">

        <a th:href="@{/admin/dashboard}"
           class="header-btn dashboard-btn">

            <i class="fa-solid fa-house"></i>
            Dashboard

        </a>

        <a th:href="@{/admin/roles}"
           class="header-btn roles-btn">

            <i class="fa-solid fa-arrow-left"></i>
            Back to Roles

        </a>

    </div>

</div>

<div th:if="${successMessage}"
     class="alert-message success-message">

    <i class="fa-solid fa-circle-check"></i>

    <span th:text="${successMessage}">
        Role updated successfully.
    </span>

</div>

<div th:if="${errorMessage}"
     class="alert-message error-message">

    <i class="fa-solid fa-circle-exclamation"></i>

    <span th:text="${errorMessage}">
        Unable to update role.
    </span>

</div>

<div class="view-card">

    <div class="card-header">

        <div class="card-heading">

            <div class="card-icon">
                <i class="fa-solid fa-user-pen"></i>
            </div>

            <h2>Edit Role</h2>

        </div>

    </div>

    <form th:action="@{/admin/roles/update/{id}(id=${role.id})}"
          th:object="${role}"
          method="post">

        <div class="form-grid">

            <div class="form-group role-id-field">

                <label>
                    <span class="label-icon">
                        <i class="fa-solid fa-hashtag"></i>
                    </span>

                    <span>Role ID</span>
                </label>

                <div class="input-wrapper">

                    <input type="text"
                           th:value="${role.id}"
                           readonly>

                </div>

            </div>

            <div class="form-group role-name-field">

                <label for="name">

                    <span class="label-icon">
                        <i class="fa-solid fa-shield-halved"></i>
                    </span>

                    <span>Role Name</span>

                </label>

                <div class="input-wrapper">

                    <input type="text"
                           id="name"
                           th:field="*{name}"
                           required>

                </div>

            </div>

            <div class="form-group description-field">

                <label for="description">

                    <span class="label-icon">
                        <i class="fa-solid fa-align-left"></i>
                    </span>

                    <span>Description</span>

                </label>

                <div class="input-wrapper">

                    <input type="text"
                           id="description"
                           th:field="*{description}">

                </div>

            </div>

        </div>

        <div class="bottom-buttons">

            <button type="submit"
                    class="action-btn update-action">

                <i class="fa-solid fa-check"></i>

                <span>Update Role</span>

            </button>

            <a th:href="@{/admin/roles/view/{id}(id=${role.id})}"
               class="action-btn cancel-action">

                <i class="fa-solid fa-xmark"></i>

                <span>Cancel</span>

            </a>

        </div>

    </form>

</div>


</div>

</body>

</html>
