<!DOCTYPE html>

<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Role Information | Legal Contract System</title>

<link rel="stylesheet" th:href="@{/css/Admin/role-view.css}">
<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">


</head>

<body>

<div class="content-container">


<div class="page-header">

    <div></div>

    <div class="header-buttons">

        <a th:href="@{/admin/dashboard}"
           class="header-btn dashboard-btn">

            <i class="fa-solid fa-house"></i>
            Dashboard

        </a>

        <a th:href="@{/admin/roles}"
           class="header-btn roles-btn">

            <i class="fa-solid fa-arrow-left"></i>
            Back to Roles

        </a>

    </div>

</div>

<div class="view-card">

    <div class="card-header">

        <div class="card-heading">

            <div class="card-icon">
                <i class="fa-solid fa-user-shield"></i>
            </div>

            <h2>Role Information</h2>

        </div>

    </div>

    <div class="form-grid">

        <div class="form-group role-id-field">

            <label>
                <span class="label-icon">
                    <i class="fa-solid fa-hashtag"></i>
                </span>

                <span>Role ID</span>
            </label>

            <div class="input-wrapper">

                <input type="text"
                       th:value="${role.id}"
                       readonly>

            </div>

        </div>

        <div class="form-group role-name-field">

            <label>
                <span class="label-icon">
                    <i class="fa-solid fa-shield-halved"></i>
                </span>

                <span>Role Name</span>
            </label>

            <div class="input-wrapper">

                <input type="text"
                       th:value="${role.name}"
                       readonly>

            </div>

        </div>

        <div class="form-group description-field">

            <label>
                <span class="label-icon">
                    <i class="fa-solid fa-align-left"></i>
                </span>

                <span>Description</span>
            </label>

            <div class="input-wrapper">

                <input type="text"
                       th:value="${role.description != null ? role.description : '-'}"
                       readonly>

            </div>

        </div>

        <div class="form-group users-field">

            <label>
                <span class="label-icon">
                    <i class="fa-solid fa-users"></i>
                </span>

                <span>Users Assigned</span>
            </label>

            <div class="input-wrapper">

                <input type="text"
                       th:value="${userCount}"
                       readonly>

            </div>

        </div>

    </div>

    <div class="bottom-buttons">

        <a th:href="@{/admin/roles}"
           class="action-btn back-action">

            <i class="fa-solid fa-arrow-left"></i>

            <span>Back</span>

        </a>

    </div>

</div>


</div>

</body>

</html>
