<!DOCTYPE html>

<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>


<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>My Profile</title>

<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<link rel="stylesheet"
      th:href="@{/css/User/profile.css}">


</head>

<body>

<main class="main-content">


<div class="page-header">

    <div>
        <h1>My Profile</h1>

        <p>
            Manage your profile and account information.
        </p>
    </div>

    <a th:href="@{/user/dashboard}"
       class="back-button">

        <i class="fa-solid fa-arrow-left"></i>

        Dashboard

    </a>

</div>


<div th:if="${successMessage}"
     class="alert-message success-message">

    <i class="fa-solid fa-circle-check"></i>

    <span th:text="${successMessage}">
        Profile photo uploaded successfully!
    </span>

</div>


<div th:if="${errorMessage}"
     class="alert-message error-message">

    <i class="fa-solid fa-circle-exclamation"></i>

    <span th:text="${errorMessage}">
        Unable to upload profile photo.
    </span>

</div>


<div class="profile-card">


    <section class="profile-photo-section">

        <div class="profile-photo">

            <img id="profileImage"
                 th:if="${user != null && user.profilePhoto != null}"
                 th:src="@{'/user/profile/photo/' + ${user.id}}"
                 alt="Profile Photo">

            <div id="defaultAvatar"
                 class="default-avatar"
                 th:style="${user != null && user.profilePhoto != null}
                 ? 'display:none'
                 : 'display:flex'">

                <i class="fa-solid fa-user"></i>

            </div>

        </div>


        <h2 th:text="${user != null ? user.username : username}">
            User
        </h2>


        <span class="role-badge">
            User
        </span>

    </section>


    <section class="basic-section">

        <div class="section-heading">

            <div class="heading-icon">

                <i class="fa-solid fa-circle-info"></i>

            </div>

            <div>

                <h2>Basic Information</h2>

                <p>Your account details</p>

            </div>

        </div>


        <div class="info-grid">


            <div class="info-box">

                <span class="info-label">

                    <i class="fa-solid fa-user"></i>

                    Username

                </span>

                <strong th:text="${user != null ? user.username : username}">
                    User
                </strong>

            </div>


            <div class="info-box">

                <span class="info-label">

                    <i class="fa-solid fa-envelope"></i>

                    Email

                </span>

                <strong th:text="${user != null ? user.email : 'Not available'}">
                    Not available
                </strong>

            </div>


            <div class="info-box">

                <span class="info-label">

                    <i class="fa-solid fa-user-shield"></i>

                    Role

                </span>

                <strong>
                    User
                </strong>

            </div>


            <div class="info-box">

                <span class="info-label">

                    <i class="fa-solid fa-circle-check"></i>

                    Status

                </span>

                <strong class="status-active">

                    <span></span>

                    Active

                </strong>

            </div>

        </div>

    </section>


    <div class="profile-actions">


        <form th:action="@{/user/profile/upload-photo}"
              method="post"
              enctype="multipart/form-data"
              id="photoForm">

            <label for="photoUpload"
                   class="action-button upload-action">

                <i class="fa-solid fa-camera"></i>

                Upload Photo

            </label>


            <input type="file"
                   id="photoUpload"
                   name="file"
                   accept="image/*"
                   hidden>

        </form>


		<a th:href="@{/user/profile/edit}"
		   class="action-button primary">
		    <i class="fa-solid fa-user-pen"></i>
		    Edit Profile
		</a>
		
        <a th:href="@{/user/change-password}"
           class="action-button secondary">

            <i class="fa-solid fa-key"></i>

            Change Password

        </a>


        <a th:href="@{/user/dashboard}"
           class="action-button primary">

            <i class="fa-solid fa-chart-line"></i>

            Go to Dashboard

        </a>

    </div>

</div>


</main>

<script>

const photoUpload =
    document.getElementById("photoUpload");

const photoForm =
    document.getElementById("photoForm");

photoUpload.addEventListener("change", function () {

    const file = this.files[0];

    if (!file) {
        return;
    }


    if (!file.type.startsWith("image/")) {

        alert("Please select a valid image file.");

        this.value = "";

        return;
    }


    const maxSize =
        5 * 1024 * 1024;


    if (file.size > maxSize) {

        alert("Photo size must be less than 5 MB.");

        this.value = "";

        return;
    }


    const reader =
        new FileReader();


    reader.onload = function (event) {

        let image =
            document.getElementById("profileImage");

        const defaultAvatar =
            document.getElementById("defaultAvatar");


        if (!image) {

            image =
                document.createElement("img");

            image.id =
                "profileImage";

            image.alt =
                "Profile Photo";

            image.style.width =
                "100%";

            image.style.height =
                "100%";

            image.style.objectFit =
                "cover";

            image.style.display =
                "block";

            document
                .querySelector(".profile-photo")
                .prepend(image);
        }


        image.src =
            event.target.result;

        image.style.display =
            "block";


        if (defaultAvatar) {

            defaultAvatar.style.display =
                "none";
        }

    };


    reader.readAsDataURL(file);


    setTimeout(function () {

        photoForm.submit();

    }, 300);

});

</script>

</body>

</html>
