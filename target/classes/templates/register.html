
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registration Page</title>


    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">


    <!-- Custom CSS -->
    <link
        rel="stylesheet"
        th:href="@{/css/register.css}">

</head>


<body>


<div class="container">


    <div class="card">


        <!-- ========================================= -->
        <!-- PAGE HEADING -->
        <!-- ========================================= -->

        <h2>

            <i class="fa-solid fa-user-plus"></i>

            Registration

        </h2>


        <!-- ========================================= -->
        <!-- ERROR MESSAGE -->
        <!-- ========================================= -->

        <p
            class="error-message"
            th:if="${errorMessage}"
            th:text="${errorMessage}">
        </p>


        <!-- ========================================= -->
        <!-- REGISTRATION FORM -->
        <!-- IMPORTANT:
             enctype is required for file upload
        ========================================== -->

        <form
            th:action="@{/register}"
            method="post"
            enctype="multipart/form-data">


            <!-- ========================================= -->
            <!-- NAME -->
            <!-- ========================================= -->

            <div class="form-group">

                <label for="name">

                    <i class="fa-solid fa-user"></i>

                    Name

                </label>


                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter Name"
                    maxlength="100"
                    required>

            </div>


            <!-- ========================================= -->
            <!-- AGE -->
            <!-- ========================================= -->

            <div class="form-group">

                <label for="age">

                    <i class="fa-solid fa-cake-candles"></i>

                    Age

                </label>


                <input
                    type="number"
                    id="age"
                    name="age"
                    placeholder="Enter Age"
                    min="18"
                    max="60"
                    required>

            </div>


            <!-- ========================================= -->
            <!-- DEPARTMENT -->
            <!-- ========================================= -->

            <div class="form-group">

                <label for="department">

                    <i class="fa-solid fa-briefcase"></i>

                    Department

                </label>


                <select
                    id="department"
                    name="department"
                    required>


                    <option value="">

                        Select Department

                    </option>


                    <option value="IT">

                        IT

                    </option>


                    <option value="Sales">

                        Sales

                    </option>


                    <option value="Operational">

                        Operational

                    </option>


                    <option value="Software Developer">

                        Software Developer

                    </option>


                    <option value="Software Testing">

                        Software Testing

                    </option>


                </select>

            </div>


            <!-- ========================================= -->
            <!-- EMAIL -->
            <!-- ========================================= -->

            <div class="form-group">

                <label for="email">

                    <i class="fa-solid fa-envelope"></i>

                    Email

                </label>


                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter Email Address"
                    maxlength="150"
                    required>

            </div>


            <!-- ========================================= -->
            <!-- CONTACT NUMBER -->
            <!-- ========================================= -->

            <div class="form-group">

                <label for="contactNo">

                    <i class="fa-solid fa-phone"></i>

                    Contact Number

                </label>


                <input
                    type="text"
                    id="contactNo"
                    name="contactNo"
                    placeholder="Enter Contact Number"
                    maxlength="10"
                    pattern="[0-9]{10}"
                    inputmode="numeric"
                    required>

            </div>


            <!-- ========================================= -->
            <!-- CITY -->
            <!-- ========================================= -->

            <div class="form-group">

                <label for="city">

                    <i class="fa-solid fa-city"></i>

                    City

                </label>


                <input
                    type="text"
                    id="city"
                    name="city"
                    placeholder="Enter City"
                    maxlength="100"
                    required>

            </div>


            <!-- ========================================= -->
            <!-- ADDRESS -->
            <!-- ========================================= -->

            <div class="form-group">

                <label for="address">

                    <i class="fa-solid fa-house"></i>

                    Address

                </label>


                <input
                    type="text"
                    id="address"
                    name="address"
                    placeholder="Enter Address"
                    maxlength="255"
                    required>

            </div>


            <!-- ========================================= -->
            <!-- PASSWORD -->
            <!-- ========================================= -->

            <div class="form-group">

                <label for="password">

                    <i class="fa-solid fa-lock"></i>

                    Password

                </label>


                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter Password"
                    minlength="6"
                    maxlength="255"
                    required>

            </div>


            <!-- ========================================= -->
            <!-- ROLE -->
            <!-- ========================================= -->

            <div class="form-group">

                <label for="roleId">

                    <i class="fa-solid fa-user-tag"></i>

                    Role

                </label>


                <select
                    id="roleId"
                    name="roleId"
                    class="form-control"
                    required>


                    <option value="">

                        Select Role

                    </option>


                    <option
                        th:each="role : ${roles}"
                        th:value="${role.id}"
                        th:text="${role.name}">

                    </option>


                </select>

            </div>


            <!-- ========================================= -->
            <!-- PROFILE PHOTO -->
            <!-- NO IMAGE PREVIEW -->
            <!-- ========================================= -->

            <div class="form-group">

				<label for="profilePhotoFile">

                    <i class="fa-solid fa-camera"></i>

                    Profile Photo

                </label>


				<input
				    type="file"
				    id="profilePhotoFile"
				    name="profilePhotoFile"
				    accept=".jpg,.jpeg,.png,image/jpeg,image/png">

                <small class="profile-help">

                    <i class="fa-solid fa-circle-info"></i>

                    JPG, JPEG or PNG only. Maximum size: 5 MB.

                </small>

            </div>


            <!-- ========================================= -->
            <!-- REGISTER BUTTON -->
            <!-- ========================================= -->

            <button
                type="submit"
                class="btn-register">

                <i class="fa-solid fa-user-plus"></i>

                Register

            </button>


            <!-- ========================================= -->
            <!-- LOGIN LINK -->
            <!-- ========================================= -->

            <p class="login-link">

                Already have an account?

                <a th:href="@{/login}">

                    Login

                </a>

            </p>


        </form>


    </div>


</div>


<!-- ========================================= -->
<!-- PROFILE PHOTO VALIDATION -->
<!-- NO PREVIEW -->
<!-- ========================================= -->

<script>

	const profilePhotoFile =
	    document.getElementById("profilePhotoFile");


    profilePhotoFile.addEventListener("change", function () {

        const file = this.files[0];


        if (!file) {
            return;
        }


        // =========================================
        // ALLOWED FILE TYPES
        // =========================================

        const allowedTypes = [

            "image/jpeg",

            "image/jpg",

            "image/png"

        ];


        if (!allowedTypes.includes(file.type)) {

            alert(
                "Invalid file type. Please select a JPG, JPEG or PNG image."
            );


            this.value = "";

            return;
        }


        // =========================================
        // MAXIMUM FILE SIZE = 5 MB
        // =========================================

        const maxSize =
            5 * 1024 * 1024;


        if (file.size > maxSize) {

            alert(
                "Profile photo must be less than 5 MB."
            );


            this.value = "";

            return;
        }

    });

</script>


</body>

</html>
