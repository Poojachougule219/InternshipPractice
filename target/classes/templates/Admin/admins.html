<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Manage Admins</title>

    <!-- CSS -->
    <link rel="stylesheet"
          th:href="@{/css/Admin/users.css?v=2}">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<div class="content-container">


    <!-- ================= SUCCESS MESSAGE ================= -->

    <div th:if="${success}"
         class="alert-message success-message">

        <i class="fa-solid fa-circle-check"></i>

        <span th:text="${success}"></span>

    </div>


    <!-- ================= ERROR MESSAGE ================= -->

    <div th:if="${error}"
         class="alert-message error-message">

        <i class="fa-solid fa-circle-exclamation"></i>

        <span th:text="${error}"></span>

    </div>



    <!-- =====================================================
         HEADER
    ====================================================== -->

    <div class="page-header">

        <div class="title-section">

            <h1>

                <i class="fa-solid fa-user-shield"></i>

                Manage Admins

            </h1>

            <p>
                View and manage all registered administrators.
            </p>

        </div>


        <div class="header-buttons">

            <a th:href="@{/admin/dashboard}"
               class="btn dashboard-btn">

                <i class="fa-solid fa-house"></i>

                Dashboard

            </a>


            <a th:href="@{/register}"
               class="btn add-btn">

                <i class="fa-solid fa-user-plus"></i>

                Add Admin

            </a>


            <button type="button"
                    onclick="window.print()"
                    class="btn print-btn">

                <i class="fa-solid fa-print"></i>

                Print

            </button>

        </div>

    </div>



    <!-- =====================================================
         SEARCH & FILTER
    ====================================================== -->

    <div class="table-card">

        <form th:action="@{/admin/admins}"
              method="get">

            <div class="filter-section">


                <!-- SEARCH -->

                <div class="search-box">

                    <input type="text"
                           name="keyword"
                           placeholder="Search Admin..."
                           th:value="${keyword}">

                    <i class="fa-solid fa-search"></i>

                </div>



                <!-- SORT FIELD -->

                <div class="filter-box">

                    <select name="sortField">

                        <option value="id"
                                th:selected="${sortField == 'id'}">

                            ID

                        </option>


                        <option value="name"
                                th:selected="${sortField == 'name'}">

                            Name

                        </option>


                        <option value="email"
                                th:selected="${sortField == 'email'}">

                            Email

                        </option>


                        <option value="createdDate"
                                th:selected="${sortField == 'createdDate'}">

                            Created Date

                        </option>

                    </select>

                </div>



                <!-- SORT DIRECTION -->

                <div class="filter-box">

                    <select name="sortDir">

                        <option value="asc"
                                th:selected="${sortDir == 'asc'}">

                            Ascending

                        </option>


                        <option value="desc"
                                th:selected="${sortDir == 'desc'}">

                            Descending

                        </option>

                    </select>

                </div>



                <!-- SEARCH BUTTON -->

                <button type="submit"
                        class="btn export-btn">

                    <i class="fa-solid fa-filter"></i>

                    Search

                </button>

            </div>

        </form>

    </div>



    <!-- =====================================================
         TABLE
    ====================================================== -->

    <div class="table-card">

        <table>

            <thead>

            <tr>


                <!-- ID -->

                <th>

                    <a th:href="@{/admin/admins(
                        page=0,
                        size=${size},
                        keyword=${keyword},
                        sortField='id',
                        sortDir=${sortDir == 'asc' ? 'desc' : 'asc'}
                    )}">

                        ID

                    </a>

                </th>



                <!-- NAME -->

                <th>

                    <a th:href="@{/admin/admins(
                        page=0,
                        size=${size},
                        keyword=${keyword},
                        sortField='name',
                        sortDir=${sortDir == 'asc' ? 'desc' : 'asc'}
                    )}">

                        Name

                    </a>

                </th>



                <!-- EMAIL -->

                <th>

                    <a th:href="@{/admin/admins(
                        page=0,
                        size=${size},
                        keyword=${keyword},
                        sortField='email',
                        sortDir=${sortDir == 'asc' ? 'desc' : 'asc'}
                    )}">

                        Email

                    </a>

                </th>


                <th>
                    Role
                </th>


                <th>
                    Department
                </th>


                <th>
                    City
                </th>


                <th>
                    Status
                </th>


                <th class="text-center">
                    Actions
                </th>

            </tr>

            </thead>



            <tbody>


            <!-- =================================================
                 NO ADMINS
            ================================================== -->

            <tr th:if="${admins == null or admins.content.isEmpty()}">

                <td colspan="8"
                    class="empty">

                    <i class="fa-solid fa-user-slash"></i>

                    No admins found

                </td>

            </tr>



            <!-- =================================================
                 ADMINS
            ================================================== -->

            <tr th:if="${admins != null}"
                th:each="admin, adminStat : ${admins.content}">


                <!-- SERIAL NUMBER -->

                <td th:text="${admins.number * admins.size + adminStat.index + 1}">
                </td>



                <!-- NAME -->

                <td th:text="${admin.name}">
                </td>



                <!-- EMAIL -->

                <td th:text="${admin.email}">
                </td>



                <!-- ROLE -->

                <td>

                    <span class="role-admin"
                          th:if="${admin.role != null
                                  and admin.role.name == 'ROLE_ADMIN'}">

                        <i class="fa-solid fa-user-shield"></i>

                        Admin

                    </span>

                </td>



                <!-- DEPARTMENT -->

                <td th:text="${admin.department}">
                </td>



                <!-- CITY -->

                <td th:text="${admin.city}">
                </td>



                <!-- STATUS -->

                <td>

                    <span class="status-active"
                          th:if="${admin.status != null
                                  and admin.status.name() == 'ACTIVE'}">

                        Active

                    </span>


                    <span class="status-inactive"
                          th:if="${admin.status != null
                                  and admin.status.name() != 'ACTIVE'}">

                        Inactive

                    </span>

                </td>



                <!-- =================================================
                     ACTIONS
                ================================================== -->

                <td>

                    <div class="action-buttons">


                        <!-- VIEW -->

                        <a th:href="@{/admin/user/view/{id}(id=${admin.id})}"
                           class="action-btn view-btn"
                           title="View">

                            <i class="fa-solid fa-eye"></i>

                        </a>



                        <!-- =================================================
                             EDIT
                             UPDATED IMPLEMENTATION
                             ================================================= -->

                        <a href="javascript:void(0);"
                           class="action-btn edit-btn"
                           title="Edit"
                           th:attr="data-id=${admin.id},
                                    data-name=${admin.name},
                                    data-email=${admin.email},
                                    data-role=${admin.role != null ? admin.role.name : 'ROLE_UNKNOWN'},
                                    data-logged-in-id=${loggedInAdminId}"
                           onclick="confirmAdminEdit(this);">

                            <i class="fa-solid fa-pen"></i>

                        </a>



                        <!-- =================================================
                             DELETE
                             source=admins is IMPORTANT
                        ================================================= -->

                        <a th:href="@{/admin/user/delete/{id}(
                                    id=${admin.id},
                                    source='admins'
                                )}"
                           class="action-btn delete-btn"
                           th:attr="data-role=${admin.role != null ? admin.role.name : 'ROLE_UNKNOWN'},
                                    data-name=${admin.name},
                                    data-email=${admin.email}"
                           onclick="return confirmAdminDelete(this);"
                           title="Delete">

                            <i class="fa-solid fa-trash"></i>

                        </a>


                    </div>

                </td>

            </tr>

            </tbody>

        </table>



        <!-- =====================================================
             PAGINATION
        ====================================================== -->

        <div class="pagination"
             th:if="${totalPages != null and totalPages > 0}">


            <!-- PREVIOUS -->

            <a th:if="${currentPage != null and currentPage > 0}"

               th:href="@{/admin/admins(
                   page=${currentPage - 1},
                   size=${size},
                   keyword=${keyword},
                   sortField=${sortField},
                   sortDir=${sortDir}
               )}">

                <i class="fa-solid fa-angle-left"></i>

                Previous

            </a>



            <!-- PAGE NUMBERS -->

            <span th:each="i : ${#numbers.sequence(0, totalPages - 1)}">

                <a th:href="@{/admin/admins(
                    page=${i},
                    size=${size},
                    keyword=${keyword},
                    sortField=${sortField},
                    sortDir=${sortDir}
                )}"

                   th:text="${i + 1}"

                   th:classappend="${i == currentPage} ? 'active-page'">

                </a>

            </span>



            <!-- NEXT -->

            <a th:if="${currentPage != null
                       and totalPages != null
                       and currentPage < totalPages - 1}"

               th:href="@{/admin/admins(
                   page=${currentPage + 1},
                   size=${size},
                   keyword=${keyword},
                   sortField=${sortField},
                   sortDir=${sortDir}
               )}">

                Next

                <i class="fa-solid fa-angle-right"></i>

            </a>

        </div>

    </div>

</div>



<script>


// =====================================================
// ADMIN DELETE CONFIRMATION
// UNCHANGED
// =====================================================

function confirmAdminDelete(button) {

    const role =
        button.getAttribute("data-role");

    const name =
        button.getAttribute("data-name");

    const email =
        button.getAttribute("data-email");


    console.log("Delete clicked");
    console.log("Role:", role);
    console.log("Name:", name);
    console.log("Email:", email);


    // =================================================
    // ADMIN PROTECTION
    // =================================================

    if (role &&
        role.trim().toUpperCase() === "ROLE_ADMIN") {

        alert(
            "You cannot delete admin profile:\n\n" +
            "Name: " + name +
            "\nEmail: " + email
        );

        return false;
    }


    // =================================================
    // DELETE CONFIRMATION
    // =================================================

    return confirm(
        "Are you sure you want to delete this admin?\n\n" +
        "Name: " + name +
        "\nEmail: " + email
    );
}



// =====================================================
// ADMIN EDIT CONFIRMATION
// UPDATED
// =====================================================

function confirmAdminEdit(button) {

    const id =
        button.getAttribute("data-id");

    const name =
        button.getAttribute("data-name");

    const email =
        button.getAttribute("data-email");

    const role =
        button.getAttribute("data-role");

    const loggedInAdminId =
        button.getAttribute("data-logged-in-id");


    console.log("Edit clicked");
    console.log("ID:", id);
    console.log("Name:", name);
    console.log("Email:", email);
    console.log("Role:", role);
    console.log("Logged-in Admin ID:", loggedInAdminId);


    // =================================================
    // ANOTHER ADMIN PROTECTION
    // =================================================

    if (
        role &&
        role.trim().toUpperCase() === "ROLE_ADMIN" &&
        id !== loggedInAdminId
    ) {

        alert(
            "You cannot edit admin profile:\n\n" +
            "Name: " + name +
            "\nEmail: " + email
        );

        return;
    }


    // =================================================
    // OWN ADMIN PROFILE
    // =================================================

    const confirmed =
        confirm(
            "Are you sure you want to edit this admin?\n\n" +
            "Name: " + name +
            "\nEmail: " + email
        );


    if (confirmed) {

        // IMPORTANT:
        // source=admins tells AdminPageController
        // to return to admins page after update/error

        window.location.href =
            "/admin/user/edit/" +
            id +
            "?source=admins";
    }

}


</script>


</body>

</html>
