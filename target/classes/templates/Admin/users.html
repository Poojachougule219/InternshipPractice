<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Total Users</title>

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- YOUR EXISTING USERS CSS -->
    <link rel="stylesheet"
          th:href="@{/css/Admin/users.css?v=3}">

</head>


<!-- =========================================================
     BODY
     
     Logged-in role is stored in data-current-role.
========================================================= -->

<body th:attr="data-current-role=${#authentication.authorities.iterator().next().authority}">


<!-- =========================================================
     MAIN CONTAINER
========================================================= -->

<div class="content-container">


    <!-- =====================================================
         PAGE HEADER
    ===================================================== -->

    <div class="page-header">


        <!-- TITLE -->

        <div class="title-section">

            <h1>

                <i class="fas fa-users"></i>

                Total Users

            </h1>

            <p>

                Manage all registered administrators and students.

            </p>

        </div>



        <!-- HEADER BUTTONS -->

        <div class="header-buttons">


            <!-- DASHBOARD -->

            <a th:href="@{/admin/dashboard}"
               class="btn dashboard-btn">

                <i class="fas fa-home"></i>

                Dashboard

            </a>



            <!-- ADD USER -->

            <a th:href="@{/admin/register}"
               class="btn add-btn">

                <i class="fas fa-user-plus"></i>

                Add User

            </a>



            <!-- EXPORT -->

            <a th:href="@{/admin/users/export(
                            keyword=${keyword},
                            role=${role},
                            sortField=${sortField},
                            sortDir=${sortDir}
                        )}"
               class="btn print-btn">

                <i class="fas fa-file-export"></i>

                Export

            </a>

        </div>

    </div>



    <!-- =====================================================
         SEARCH + FILTER
    ===================================================== -->

    <div class="table-card">

        <form th:action="@{/admin/users}"
              method="get">


            <div class="filter-section">


                <!-- SEARCH -->

                <div class="search-box">

                    <input type="text"
                           name="keyword"
                           th:value="${keyword}"
                           placeholder="Search User..."
                           autocomplete="off">

                    <i class="fas fa-search"></i>

                </div>



                <!-- ROLE -->

                <div class="filter-box">

                    <select name="role">

                        <option value="">

                            All Roles

                        </option>


                        <option value="ROLE_ADMIN"
                                th:selected="${role == 'ROLE_ADMIN'}">

                            Admin

                        </option>


                        <option value="ROLE_STUDENT"
                                th:selected="${role == 'ROLE_STUDENT'}">

                            Student

                        </option>

                    </select>

                </div>



                <!-- SORT FIELD -->

                <div class="filter-box">

                    <select name="sortField">


                        <option value="createdDate"
                                th:selected="${sortField == 'createdDate'}">

                            Registered Date

                        </option>


                        <option value="name"
                                th:selected="${sortField == 'name'}">

                            Name

                        </option>


                        <option value="email"
                                th:selected="${sortField == 'email'}">

                            Email

                        </option>


                        <option value="city"
                                th:selected="${sortField == 'city'}">

                            City

                        </option>


                        <option value="department"
                                th:selected="${sortField == 'department'}">

                            Department

                        </option>

                    </select>

                </div>



                <!-- SORT DIRECTION -->

                <div class="filter-box">

                    <select name="sortDir">


                        <option value="desc"
                                th:selected="${sortDir == 'desc'}">

                            Latest First

                        </option>


                        <option value="asc"
                                th:selected="${sortDir == 'asc'}">

                            Oldest First

                        </option>

                    </select>

                </div>



                <!-- SEARCH BUTTON -->

                <button type="submit"
                        class="export-btn">

                    <i class="fas fa-search"></i>

                    Search

                </button>

            </div>

        </form>

    </div>



    <!-- =====================================================
         USERS TABLE
    ===================================================== -->

    <div class="table-card">

        <table>


            <!-- =================================================
                 TABLE HEADER
            ================================================= -->

            <thead>

            <tr>


                <!-- NAME -->

                <th>

                    <a th:href="@{/admin/users(
                            page=0,
                            size=${size},
                            keyword=${keyword},
                            role=${role},
                            sortField='name',
                            sortDir=${sortField == 'name' and sortDir == 'asc' ? 'desc' : 'asc'}
                        )}">

                        Name

                    </a>

                </th>



                <!-- EMAIL -->

                <th>

                    <a th:href="@{/admin/users(
                            page=0,
                            size=${size},
                            keyword=${keyword},
                            role=${role},
                            sortField='email',
                            sortDir=${sortField == 'email' and sortDir == 'asc' ? 'desc' : 'asc'}
                        )}">

                        Email

                    </a>

                </th>



                <!-- ROLE -->

                <th>

                    Role

                </th>



                <!-- DEPARTMENT -->

                <th>

                    Department

                </th>



                <!-- CITY -->

                <th>

                    City

                </th>



                <!-- REGISTERED DATE -->

                <th>

                    <a th:href="@{/admin/users(
                            page=0,
                            size=${size},
                            keyword=${keyword},
                            role=${role},
                            sortField='createdDate',
                            sortDir=${sortField == 'createdDate' and sortDir == 'asc' ? 'desc' : 'asc'}
                        )}">

                        Registered On

                    </a>

                </th>



                <!-- STATUS -->

                <th>

                    Status

                </th>



                <!-- ACTIONS -->

                <th>

                    Actions

                </th>

            </tr>

            </thead>



            <!-- =================================================
                 TABLE BODY
            ================================================= -->

            <tbody>


            <!-- =================================================
                 USER ROW
            ================================================= -->

            <tr th:each="user : ${users}">


                <!-- NAME -->

                <td th:text="${user.name}">

                    Pooja

                </td>



                <!-- EMAIL -->

                <td th:text="${user.email}">

                    pooja@gmail.com

                </td>



                <!-- ROLE -->

                <td>


                    <!-- ADMIN -->

                    <span th:if="${user.role != null
                                  and user.role.name == 'ROLE_ADMIN'}"
                          class="role-admin">

                        <i class="fas fa-user-shield"></i>

                        Admin

                    </span>



                    <!-- STUDENT -->

                    <span th:if="${user.role != null
                                  and user.role.name == 'ROLE_STUDENT'}"
                          class="role-student">

                        <i class="fas fa-user-graduate"></i>

                        Student

                    </span>



                    <!-- OTHER -->

                    <span th:if="${user.role == null
                                  or (user.role.name != 'ROLE_ADMIN'
                                  and user.role.name != 'ROLE_STUDENT')}"
                          class="role-student">

                        <i class="fas fa-user"></i>

                        User

                    </span>

                </td>



                <!-- DEPARTMENT -->

                <td th:text="${user.department}">

                    Software Developer

                </td>



                <!-- CITY -->

                <td th:text="${user.city}">

                    Pune

                </td>



                <!-- REGISTERED DATE -->

                <td>


                    <span th:if="${user.createdDate != null}"
                          th:text="${#temporals.format(
                                      user.createdDate,
                                      'dd-MM-yyyy HH:mm'
                                   )}">

                        14-08-2026 15:17

                    </span>


                    <span th:if="${user.createdDate == null}">

                        -

                    </span>

                </td>



                <!-- STATUS -->

                <td>


                    <!-- ACTIVE -->

                    <span th:if="${user.status != null
                                  and user.status.name() == 'ACTIVE'}"
                          class="status-active">

                        Active

                    </span>



                    <!-- INACTIVE -->

                    <span th:if="${user.status != null
                                  and user.status.name() != 'ACTIVE'}"
                          class="status-inactive">

                        Inactive

                    </span>



                    <!-- NULL STATUS -->

                    <span th:if="${user.status == null}"
                          class="status-inactive">

                        Inactive

                    </span>

                </td>



                <!-- =================================================
                     ACTIONS
                ================================================= -->

                <td>

                    <div class="action-buttons">


                        <!-- =================================================
                             VIEW
                        ================================================= -->

                        <a th:href="@{/admin/user/view/{id}(id=${user.id})}"
                           class="action-btn view-btn"
                           title="View">

                            <i class="fas fa-eye"></i>

                        </a>



                        <!-- =================================================
                             EDIT
                             JAVASCRIPT POPUP
                        ================================================= -->

                        <button type="button"
                                class="action-btn edit-btn edit-user-btn"
                                title="Edit"

                                th:attr="
                                    data-name=${user.name},
                                    data-email=${user.email},
                                    data-role=${user.role != null ? user.role.name : 'USER'},
                                    data-id=${user.id},
                                    data-current-email=${#authentication.name}
                                ">

                            <i class="fas fa-pen"></i>

                        </button>



                        <!-- =================================================
                             DELETE
                             JAVASCRIPT CONFIRM POPUP
                        ================================================= -->

                        <button type="button"
                                class="action-btn delete-btn delete-user-btn"
                                title="Delete"

                                th:attr="
                                    data-name=${user.name},
                                    data-email=${user.email},
                                    data-role=${user.role != null ? user.role.name : 'USER'},
                                    data-id=${user.id},
                                    data-current-email=${#authentication.name}
                                ">

                            <i class="fas fa-trash"></i>

                        </button>


                    </div>

                </td>


            </tr>



            <!-- =================================================
                 NO USERS
            ================================================= -->

            <tr th:if="${users == null or users.isEmpty()}">

                <td colspan="8"
                    class="empty">

                    <i class="fas fa-users"></i>

                    No users found.

                </td>

            </tr>


            </tbody>

        </table>

    </div>



    <!-- =====================================================
         PAGINATION
    ===================================================== -->

    <div class="pagination"
         th:if="${totalPages != null and totalPages > 0}">


        <!-- PREVIOUS -->

        <a th:href="@{/admin/users(
                page=${currentPage - 1},
                size=${size},
                keyword=${keyword},
                role=${role},
                sortField=${sortField},
                sortDir=${sortDir}
            )}"

           th:classappend="${currentPage == 0 ? ' disabled' : ''}">

            <i class="fas fa-chevron-left"></i>

        </a>



        <!-- PAGE NUMBERS -->

        <a th:each="pageNumber : ${#numbers.sequence(0, totalPages - 1)}"

           th:href="@{/admin/users(
                page=${pageNumber},
                size=${size},
                keyword=${keyword},
                role=${role},
                sortField=${sortField},
                sortDir=${sortDir}
            )}"

           th:text="${pageNumber + 1}"

           th:classappend="${pageNumber == currentPage ? ' active-page' : ''}">

            1

        </a>



        <!-- NEXT -->

        <a th:href="@{/admin/users(
                page=${currentPage + 1},
                size=${size},
                keyword=${keyword},
                role=${role},
                sortField=${sortField},
                sortDir=${sortDir}
            )}"

           th:classappend="${currentPage + 1 >= totalPages ? ' disabled' : ''}">

            <i class="fas fa-chevron-right"></i>

        </a>


    </div>


</div>



<!-- =========================================================
     JAVASCRIPT
     
     ONLY JAVASCRIPT POPUPS
     NO CUSTOM POPUP HTML
     NO CUSTOM POPUP CSS
========================================================= -->

<script>

document.addEventListener("DOMContentLoaded", function () {


    /* =====================================================
       EDIT POPUP
    ===================================================== */

    const editButtons =
        document.querySelectorAll(".edit-user-btn");


    editButtons.forEach(function (button) {


        button.addEventListener("click", function () {


            const name =
                button.getAttribute("data-name");


            const email =
                button.getAttribute("data-email");


            const role =
                button.getAttribute("data-role");


            const currentEmail =
                button.getAttribute("data-current-email");



            /* =================================================
               OWN ADMIN PROFILE
            ================================================= */

            if (currentEmail === email) {

                window.location.href =
                    "/admin/edit-profile";

                return;
            }



            /* =================================================
               OTHER ADMIN
            ================================================= */

            if (role === "ROLE_ADMIN") {

                alert(
                    "You cannot edit admin profile.\n\n" +
                    "Name: " + name + "\n" +
                    "Email: " + email
                );

                return;
            }



            /* =================================================
               STUDENT
            ================================================= */

            alert(
                "You cannot edit student profile.\n\n" +
                "Name: " + name + "\n" +
                "Email: " + email
            );

        });

    });



    /* =====================================================
       DELETE POPUP
       ONLY JAVASCRIPT confirm()
    ===================================================== */

    const deleteButtons =
        document.querySelectorAll(".delete-user-btn");


    deleteButtons.forEach(function (button) {


        button.addEventListener("click", function () {


            const name =
                button.getAttribute("data-name");


            const email =
                button.getAttribute("data-email");


            const role =
                button.getAttribute("data-role");


            const currentEmail =
                button.getAttribute("data-current-email");


            const userId =
                button.getAttribute("data-id");



            /* =================================================
               ADMIN CANNOT DELETE OWN PROFILE
            ================================================= */

            if (currentEmail === email) {

                alert(
                    "You cannot delete your own profile.\n\n" +
                    "Name: " + name + "\n" +
                    "Email: " + email
                );

                return;
            }



            /* =================================================
               ADMIN CANNOT DELETE ANOTHER ADMIN
            ================================================= */

            if (role === "ROLE_ADMIN") {

                alert(
                    "You cannot delete admin profile.\n\n" +
                    "Name: " + name + "\n" +
                    "Email: " + email
                );

                return;
            }



            /* =================================================
               GET LOGGED-IN ROLE
            ================================================= */

            const loggedInRole =
                document.body.getAttribute(
                    "data-current-role"
                );



            /* =================================================
               ONLY ADMIN CAN DELETE STUDENT
            ================================================= */

            if (loggedInRole !== "ROLE_ADMIN") {

                alert(
                    "You cannot delete student profile.\n\n" +
                    "Name: " + name + "\n" +
                    "Email: " + email
                );

                return;
            }



            /* =================================================
               CONFIRM DELETE
               
               JAVASCRIPT ONLY
               
               OK = TRUE
               CANCEL = FALSE
            ================================================= */

            const confirmed =
                confirm(
                    "Are you sure you want to delete this student profile?\n\n" +
                    "Name: " + name + "\n" +
                    "Email: " + email
                );



            /* =================================================
               OK
               
               CALL EXISTING SOFT DELETE CONTROLLER
            ================================================= */

            if (confirmed) {

                window.location.href =
                    "/admin/user/delete/"
                    + userId
                    + "?source=users";

                return;
            }



            /* =================================================
               CANCEL
               
               DO NOTHING
            ================================================= */

            return;

        });

    });

});

</script>


</body>

</html>
