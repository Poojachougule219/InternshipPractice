<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Edit Profile</title>


    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">


    <!-- Custom CSS -->
    <link rel="stylesheet"
          th:href="@{/css/Student/edit_profile.css}">

</head>


<body>


<div class="row justify-content-center w-100">


    <div class="col-lg-5 col-md-6 col-sm-8">


        <div class="card shadow-lg border-0 rounded-4">


            <!-- ===================================== -->
            <!-- HEADER -->
            <!-- ===================================== -->

            <div class="card-header text-white text-center">

                <h2>
                    Edit Profile
                </h2>

            </div>


            <!-- ===================================== -->
            <!-- BODY -->
            <!-- ===================================== -->

            <div class="card-body">


                <!--
                IMPORTANT:
                multipart/form-data is required
                for profile photo upload.
                -->

                <form th:action="@{/student/update-profile}"
                      th:object="${student}"
                      method="post"
                      enctype="multipart/form-data">


                    <!-- ================================= -->
                    <!-- FULL NAME -->
                    <!-- ================================= -->

                    <div class="mb-3">

                        <label for="name"
                               class="form-label">

                            Full Name

                        </label>


                        <input type="text"
                               id="name"
                               class="form-control"
                               th:field="*{name}"
                               maxlength="100"
                               required>

                    </div>


                    <!-- ================================= -->
                    <!-- EMAIL -->
                    <!-- ================================= -->

                    <div class="mb-3">

                        <label for="email"
                               class="form-label">

                            Email

                        </label>


                        <input type="email"
                               id="email"
                               class="form-control"
                               th:field="*{email}"
                               readonly>

                    </div>


                    <!-- ================================= -->
                    <!-- AGE -->
                    <!-- ================================= -->

                    <div class="mb-3">

                        <label for="age"
                               class="form-label">

                            Age

                        </label>


                        <input type="number"
                               id="age"
                               class="form-control"
                               th:field="*{age}"
                               min="18"
                               max="60"
                               required>

                    </div>


                    <!-- ================================= -->
                    <!-- DEPARTMENT -->
                    <!-- ================================= -->

                    <div class="mb-3">

                        <label for="department"
                               class="form-label">

                            Department

                        </label>


                        <input type="text"
                               id="department"
                               class="form-control"
                               th:field="*{department}"
                               maxlength="100"
                               required>

                    </div>


                    <!-- ================================= -->
                    <!-- CONTACT NUMBER -->
                    <!-- ================================= -->

                    <div class="mb-3">

                        <label for="contactNo"
                               class="form-label">

                            Contact Number

                        </label>


                        <input type="text"
                               id="contactNo"
                               class="form-control"
                               th:field="*{contactNo}"
                               maxlength="10"
                               pattern="[0-9]{10}"
                               inputmode="numeric"
                               required>

                    </div>


                    <!-- ================================= -->
                    <!-- CITY -->
                    <!-- ================================= -->

                    <div class="mb-3">

                        <label for="city"
                               class="form-label">

                            City

                        </label>


                        <input type="text"
                               id="city"
                               class="form-control"
                               th:field="*{city}"
                               maxlength="100"
                               required>

                    </div>


                    <!-- ================================= -->
                    <!-- ADDRESS -->
                    <!-- ================================= -->

                    <div class="mb-3">

                        <label for="address"
                               class="form-label">

                            Address

                        </label>


                        <textarea id="address"
                                  class="form-control"
                                  rows="2"
                                  th:field="*{address}"
                                  maxlength="255"
                                  required></textarea>

                    </div>


                    <!-- ================================= -->
                    <!-- PROFILE PHOTO -->
                    <!-- ================================= -->

                    <div class="mb-3">

                        <label for="profilePhotoFile"
                               class="form-label">

                            Profile Photo

                        </label>


                        <!-- IMPORTANT:
                             Do NOT use name="profilePhoto"
                             because Student.profilePhoto is String.
                        -->

                        <input type="file"
                               id="profilePhotoFile"
                               name="profilePhotoFile"
                               class="form-control"
                               accept=".jpg,.jpeg,.png,image/jpeg,image/png">


                        <small class="text-muted">

                            JPG, JPEG or PNG only.
                            Maximum size: 5 MB.

                        </small>

                    </div>


                    <!-- ================================= -->
                    <!-- BUTTONS -->
                    <!-- ================================= -->

                    <div class="text-center mt-4">


                        <button type="submit"
                                class="btn btn-primary px-4">

                            Update Profile

                        </button>


                        <a th:href="@{/student/profile}"
                           class="btn btn-secondary px-4">

                            Cancel

                        </a>


                        <a th:href="@{/student/dashboard}"
                           class="btn btn-dark px-4">

                            Dashboard

                        </a>

                    </div>


                </form>


            </div>


        </div>


    </div>


</div>


</body>

</html>
