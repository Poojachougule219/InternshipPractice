<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<title>Verify OTP</title>

<link rel="stylesheet" th:href="@{/css/Student/verify_otp.css}">

</head>


<body>

	

<div class="password-container">


    <div class="password-card">


        <h2>Verify OTP</h2>


        <p th:if="${success}"
           th:text="${success}"
           class="success-message">
        </p>


        <p th:if="${error}"
           th:text="${error}"
           class="error-message">
        </p>



        <form th:action="@{/verify-otp}" method="post">


            <input type="hidden"
                   name="email"
                   th:value="${email}">



            <div class="input-group">

                <label>Enter OTP</label>

                <input type="text"
                       name="otp"
                       placeholder="Enter 6 digit OTP"
                       maxlength="6"
                       required>

            </div>



            <button type="submit">
                Verify OTP
            </button>


        </form>



        <a th:href="@{/forgot-password}" class="back-btn">
            ← Back
        </a>


    </div>


</div>


</body>

</html>
