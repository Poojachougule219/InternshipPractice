<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Change Password</title>

    <link rel="stylesheet"
          th:href="@{/css/Student/change_password.css}">

</head>


<body>


<div class="password-container">


    <div class="password-card">


        <!-- =====================================================
             HEADER
        ====================================================== -->

        <h2>Change Password</h2>


        <!-- =====================================================
             ERROR MESSAGE
        ====================================================== -->

        <p th:if="${error}"
           th:text="${error}"
           class="error-message">
        </p>


        <!-- =====================================================
             SUCCESS MESSAGE
        ====================================================== -->

        <p th:if="${success}"
           th:text="${success}"
           class="success-message">
        </p>


        <!-- =====================================================
             CHANGE PASSWORD FORM
        ====================================================== -->

        <form th:action="@{/student/change-password}"
              method="post">


            <!-- CURRENT PASSWORD -->

            <div class="input-group">

                <label for="oldPassword">
                    Current Password
                </label>

                <input type="password"
                       id="oldPassword"
                       name="oldPassword"
                       placeholder="Enter current password"
                       required>

            </div>



            <!-- NEW PASSWORD -->

            <div class="input-group">

                <label for="newPassword">
                    New Password
                </label>

                <input type="password"
                       id="newPassword"
                       name="newPassword"
                       placeholder="Enter new password"
                       required>

            </div>



            <!-- CONFIRM PASSWORD -->

            <div class="input-group">

                <label for="confirmPassword">
                    Confirm New Password
                </label>

                <input type="password"
                       id="confirmPassword"
                       name="confirmPassword"
                       placeholder="Confirm new password"
                       required>

            </div>



            <!-- =================================================
                 BUTTONS
            ================================================== -->

            <div class="button-group">


                <!-- UPDATE PASSWORD -->

                <button type="submit">
                    Update Password
                </button>


                <!-- DASHBOARD -->

                <a th:href="@{/student/dashboard}"
                   class="dashboard-btn">

                    Dashboard

                </a>


            </div>


        </form>


    </div>


</div>


</body>

</html>
