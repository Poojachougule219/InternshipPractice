<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Change Password</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet"
          th:href="@{/css/Student/change_password.css}">
</head>

<body>

<div class="change-password-container">

    <div class="change-password-card">

        <!-- ========================================= -->
        <!-- HEADER -->
        <!-- ========================================= -->

        <div class="change-password-header">

            <h2>
                <i class="fa-solid fa-lock"></i>
                Change Password
            </h2>

            <p>
                Update your account password securely
            </p>

        </div>


        <!-- ========================================= -->
        <!-- SUCCESS MESSAGE -->
        <!-- ========================================= -->

        <div th:if="${success}"
             class="alert alert-success message"
             role="alert">

            <i class="fa-solid fa-circle-check"></i>

            <span th:text="${success}">
                Password changed successfully
            </span>

        </div>


        <!-- ========================================= -->
        <!-- ERROR MESSAGE -->
        <!-- ========================================= -->

        <div th:if="${error}"
             class="alert alert-danger message"
             role="alert">

            <i class="fa-solid fa-circle-exclamation"></i>

            <span th:text="${error}">
                Error
            </span>

        </div>


        <!-- ========================================= -->
        <!-- PASSWORD FORM -->
        <!-- ========================================= -->

        <div class="password-section">

            <form th:action="@{/student/change-password}"
                  method="post">


                <!-- CURRENT PASSWORD -->

                <div class="password-group">

                    <label for="oldPassword">
                        <i class="fa-solid fa-key"></i>
                        Current Password
                    </label>

                    <input type="password"
                           id="oldPassword"
                           name="oldPassword"
                           class="password-input"
                           required>

                </div>


                <!-- NEW PASSWORD -->

                <div class="password-group">

                    <label for="newPassword">
                        <i class="fa-solid fa-lock"></i>
                        New Password
                    </label>

                    <input type="password"
                           id="newPassword"
                           name="newPassword"
                           class="password-input"
                           minlength="6"
                           required>

                    <small class="password-hint">
                        Minimum 6 characters.
                    </small>

                </div>


                <!-- CONFIRM PASSWORD -->

                <div class="password-group">

                    <label for="confirmPassword">
                        <i class="fa-solid fa-lock"></i>
                        Confirm New Password
                    </label>

                    <input type="password"
                           id="confirmPassword"
                           name="confirmPassword"
                           class="password-input"
                           minlength="6"
                           required>

                </div>


                <!-- ========================================= -->
                <!-- BUTTONS -->
                <!-- ========================================= -->

                <div class="button-area">

                    <!-- Change Password -->

                    <button type="submit"
                            class="change-btn">

                        <i class="fa-solid fa-key"></i>

                        Change Password

                    </button>


                    <!-- Back to Profile -->

                    <a th:href="@{/student/profile}"
                       class="back-btn">

                        <i class="fa-solid fa-user"></i>

                        Profile

                    </a>


                    <!-- Dashboard -->

                    <a th:href="@{/student/dashboard}"
                       class="dashboard-btn">

                        <i class="fa-solid fa-house"></i>

                        Dashboard

                    </a>

                </div>

            </form>

        </div>

    </div>

</div>


<!-- Bootstrap JS -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>

</html>
