<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Student Profile</title>


    <!-- Bootstrap -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">


    <!-- Bootstrap Icons -->

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">


    <!-- Student Profile CSS -->

    <link rel="stylesheet"
          th:href="@{/css/Student/profile.css}">


    <!-- Font Awesome -->

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>


<body>


<div class="container">


    <div class="profile-card">


        <!-- =================================================
             SUCCESS / ERROR MESSAGE
        ================================================== -->

        <div th:if="${success}"
             class="alert alert-success alert-dismissible fade show profile-message"
             role="alert">

            <i class="fa-solid fa-circle-check"></i>

            <span th:text="${success}">
                Profile updated successfully
            </span>

            <button type="button"
                    class="btn-close"
                    data-bs-dismiss="alert"
                    aria-label="Close">
            </button>

        </div>


        <div th:if="${error}"
             class="alert alert-danger alert-dismissible fade show profile-message"
             role="alert">

            <i class="fa-solid fa-circle-exclamation"></i>

            <span th:text="${error}">
                Something went wrong
            </span>

            <button type="button"
                    class="btn-close"
                    data-bs-dismiss="alert"
                    aria-label="Close">
            </button>

        </div>


        <!-- =================================================
             COVER SECTION
        ================================================== -->

        <div class="cover-section">
        </div>


        <!-- =================================================
             PROFILE PHOTO
        ================================================== -->

        <div class="text-center">

            <!-- Profile Photo -->

            <img th:if="${student.profilePhoto != null
                         and student.profilePhoto.length > 0}"

                 th:src="@{/student/profile-photo}"

                 class="profile-image"

                 alt="Profile">


            <!-- Default Photo -->

            <img th:unless="${student.profilePhoto != null
                              and student.profilePhoto.length > 0}"

                 th:src="@{/img/default-profile.png}"

                 class="profile-image"

                 alt="Profile">

        </div>


        <!-- =================================================
             STUDENT NAME
        ================================================== -->

        <div class="text-center mt-3">

            <h2 th:text="${student.name}">
                Student Name
            </h2>


            <h6 class="text-muted"
                th:text="${student.department}">
                Department
            </h6>


            <p class="email"
               th:text="${student.email}">
                student@email.com
            </p>

        </div>


        <!-- =================================================
             PERSONAL INFORMATION
        ================================================== -->

        <div class="info-card">

            <h4>

                <i class="bi bi-person-circle"></i>

                Personal Information

            </h4>


            <hr>


            <div class="row">


                <!-- LEFT COLUMN -->

                <div class="col-md-6">


                    <!-- NAME -->

                    <div class="info-item">

                        <strong>
                            Name
                        </strong>

                        <span th:text="${student.name}">
                            Student
                        </span>

                    </div>


                    <!-- EMAIL -->

                    <div class="info-item">

                        <strong>
                            Email
                        </strong>

                        <span th:text="${student.email}">
                            student@email.com
                        </span>

                    </div>


                    <!-- AGE -->

                    <div class="info-item">

                        <strong>
                            Age
                        </strong>

                        <span th:text="${student.age}">
                            22
                        </span>

                    </div>


                </div>


                <!-- RIGHT COLUMN -->

                <div class="col-md-6">


                    <!-- DEPARTMENT -->

                    <div class="info-item">

                        <strong>
                            Department
                        </strong>

                        <span th:text="${student.department}">
                            IT
                        </span>

                    </div>


                    <!-- CITY -->

                    <div class="info-item">

                        <strong>
                            City
                        </strong>

                        <span th:text="${student.city}">
                            Pune
                        </span>

                    </div>


                    <!-- STATUS -->

                    <div class="info-item">

                        <strong>
                            Status
                        </strong>

                        <span class="badge bg-success"
                              th:text="${student.status}">
                            ACTIVE
                        </span>

                    </div>


                </div>

            </div>

        </div>


        <!-- =================================================
             BUTTONS
        ================================================== -->

        <div class="text-center mt-4 mb-4">


            <!-- EDIT PROFILE -->

            <a th:href="@{/student/edit-profile}"
               class="btn btn-edit">

                <i class="fa-solid fa-user-pen"></i>

                Edit Profile

            </a>


            <!-- UPLOAD PHOTO -->

            <a th:href="@{/student/upload-photo}"
               class="btn btn-primary">

                <i class="fa-solid fa-camera"></i>

                Upload Photo

            </a>


            <!-- CHANGE PASSWORD -->

            <a th:href="@{/student/change-password}"
               class="btn btn-warning text-white">

                <i class="bi bi-lock-fill"></i>

                Change Password

            </a>


            <!-- DASHBOARD -->

            <a th:href="@{/student/dashboard}"
               class="btn btn-dashboard">

                Dashboard

            </a>


        </div>


    </div>

</div>


<!-- =================================================
     BOOTSTRAP JAVASCRIPT
================================================== -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


</body>

</html>
