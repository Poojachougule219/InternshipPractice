<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Student Profile</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet"
          th:href="@{/css/Student/profile.css}">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body>

<div class="container">

    <div class="profile-card">

        <!-- Cover Section -->
        <div class="cover-section">
        </div>


        <!-- Profile Photo -->
        <div class="text-center">

            <img th:if="${student.profilePhoto != null
                         and !student.profilePhoto.isEmpty()}"
                 th:src="@{'/uploads/Profile/Student photos/' + ${student.profilePhoto}}"
                 class="profile-image"
                 alt="Profile">

            <img th:unless="${student.profilePhoto != null
                              and !student.profilePhoto.isEmpty()}"
                 th:src="@{/img/default-profile.png}"
                 class="profile-image"
                 alt="Profile">

        </div>


        <!-- Name -->
        <div class="text-center mt-3">

            <h2 th:text="${student.name}">
            </h2>

            <h6 class="text-muted"
                th:text="${student.department}">
            </h6>

            <p class="email"
               th:text="${student.email}">
            </p>

        </div>


        <!-- Personal Information -->
        <div class="info-card">

            <h4>
                <i class="bi bi-person-circle"></i>
                Personal Information
            </h4>

            <hr>

            <div class="row">

                <div class="col-md-6">

                    <div class="info-item">

                        <strong>Name</strong>

                        <span th:text="${student.name}">
                        </span>

                    </div>


                    <div class="info-item">

                        <strong>Email</strong>

                        <span th:text="${student.email}">
                        </span>

                    </div>


                    <div class="info-item">

                        <strong>Age</strong>

                        <span th:text="${student.age}">
                        </span>

                    </div>

                </div>


                <div class="col-md-6">

                    <div class="info-item">

                        <strong>Department</strong>

                        <span th:text="${student.department}">
                        </span>

                    </div>


                    <div class="info-item">

                        <strong>City</strong>

                        <span th:text="${student.city}">
                        </span>

                    </div>


                    <div class="info-item">

                        <strong>Status</strong>

                        <span class="badge bg-success"
                              th:text="${student.status}">
                        </span>

                    </div>

                </div>

            </div>

        </div>


        <!-- Buttons -->
        <div class="text-center mt-4 mb-4">

            <a th:href="@{/student/edit-profile}"
               class="btn btn-edit">

                <i class="fa-solid fa-user-pen"></i>

                Edit Profile

            </a>


            <a th:href="@{/student/upload-photo}"
               class="btn btn-primary">

                <i class="fa-solid fa-camera"></i>

                Upload Photo

            </a>


            <a th:href="@{/student/change-password}"
               class="btn btn-warning text-white">

                <i class="bi bi-lock-fill"></i>

                Change Password

            </a>


            <a th:href="@{/student/dashboard}"
               class="btn btn-primary">

                Dashboard

            </a>

        </div>

    </div>

</div>

</body>

</html>
